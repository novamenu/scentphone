<style>
/* Basis die Claude voorheen leverde: veilige zones (notch, thuisbalk) en reset */
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}

[hidden]{display:none!important}

<body>
<style>
/* Layout: één-scherm app-shell (max 520px), vaste topbalk + scrollend paneel + tabbalk; luxe vitrine-ritme met goudlijnen */
:root{
  --ink:#0c0b09;        /* achtergrond: zwart met warme ondertoon */
  --panel:#16140f;      /* vitrinepaneel */
  --panel-2:#1e1b14;
  --line:rgba(201,164,92,.22);
  --gold:#c9a45c;
  --gold-hi:#ead39b;
  --ivory:#f6f2e9;      /* wit */
  --muted:#a39b86;
  --dim:#6f6958;
  --ok:#8fbf8a; --warn:#e0b45a; --bad:#e07a6a; --sim:#9db4d6;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--ink);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* iOS: aanrakingen altijd naar de knop zelf sturen, niet naar afbeeldingen of tekst erin */
.item *,.card *,.mini *,.result *,.tile *{pointer-events:none}
.item:active,.card:active,.mini:active{opacity:.7}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:6px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:
  radial-gradient(120% 60% at 50% -10%,rgba(201,164,92,.10),transparent 60%),var(--ink)}
@media (min-width:560px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* Topbalk */
.topbar{flex:none;display:flex;align-items:center;gap:10px;padding-block:12px;min-height:58px;border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--gold-hi);flex:none}
.topbar h1{margin:0;font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:.02em}
.wordmark em{font-style:italic;color:var(--gold)}
/* Officieel logo (origineel, alleen bijgesneden) */
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brandmark .emb{height:42px;width:auto;flex:none;border-radius:8px;mix-blend-mode:lighten}
.brandmark .wm{height:clamp(22px,6.4vw,30px);width:auto;max-width:100%;min-width:0;object-fit:contain;object-position:left center;mix-blend-mode:lighten}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(70% 50% at 50% 45%,#2a2115,#0c0b09 70%);padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));transition:opacity .6s ease,visibility .6s;cursor:pointer;-webkit-tap-highlight-color:transparent}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:22px;width:min(78vw,62vh,440px)}
#splash img{width:100%;height:auto;aspect-ratio:1/1;border-radius:22%;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(201,164,92,.18);animation:spIn 1.1s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-line{width:46%;height:2px;border-radius:2px;background:rgba(201,164,92,.18);overflow:hidden}
#splash .sp-line i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);animation:spLoad 1.2s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes spLoad{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--gold-hi);white-space:nowrap}
.pill.sim{color:var(--sim);border-color:rgba(157,180,214,.4)}
.pill.ok{color:var(--ok);border-color:rgba(143,191,138,.4)}
.pill.warn{color:var(--warn);border-color:rgba(224,180,90,.4)}
.pill.future{color:var(--muted);border-color:rgba(163,155,134,.35)}

/* Hoofdpaneel */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-block:6px 28px;overscroll-behavior:contain}
.view{display:flex;flex-direction:column;gap:22px;animation:rise .38s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Tabbalk */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(12,11,9,.94);backdrop-filter:blur(10px);padding-block:6px 8px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:10.5px;letter-spacing:.06em;transition:color .2s}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--gold-hi)}
.tab.scan .ring{width:44px;height:44px;margin-top:-18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold-hi),var(--gold) 55%,#8c6d33);color:var(--ink);box-shadow:0 6px 18px rgba(201,164,92,.35)}

/* Typografie */
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h2.sec{font-family:var(--display);font-weight:500;font-size:22px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}
.section{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* Knoppen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:99px;border:1px solid var(--gold);background:transparent;color:var(--gold-hi);font-weight:500;letter-spacing:.06em;font-size:13.5px;text-transform:uppercase;transition:transform .15s,background .2s,color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(145deg,var(--gold-hi),var(--gold) 60%,#a9853e);color:var(--ink);border-color:transparent}
.btn.ghost{border-color:var(--line);color:var(--ivory)}
.btn.danger{border-color:rgba(224,122,106,.5);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--gold-hi);flex:none}
.iconbtn svg{width:19px;height:19px}

/* Home */
.hero{padding-top:10px;display:flex;flex-direction:column;gap:8px}
.hero .big{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.02;letter-spacing:-.01em;margin:0}
.hero .big em{color:var(--gold);font-style:italic}
.hero p{color:var(--muted);max-width:34ch}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:linear-gradient(170deg,var(--panel-2),var(--panel));border-radius:var(--r);padding:16px 14px 14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;color:var(--ivory);transition:transform .2s,border-color .2s}
.tile:active{transform:scale(.98)}
.tile:hover{border-color:rgba(201,164,92,.5)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(234,211,155,.10) 48%,transparent 62%);transform:translateX(-120%);transition:transform .9s;pointer-events:none}
.tile:hover::after{transform:translateX(120%)}
.tile .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold-hi)}
.tile .ic svg{width:20px;height:20px}
.tile b{display:block;font-family:var(--display);font-weight:500;font-size:19px;line-height:1.15}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.feature{grid-column:1/-1;min-height:120px;flex-direction:row;align-items:center;background:linear-gradient(120deg,#2a2213,var(--panel) 70%)}
.tile.feature .ic{width:56px;height:56px;background:linear-gradient(145deg,var(--gold-hi),var(--gold));color:var(--ink);border:0}
.tile.feature .ic svg{width:26px;height:26px}
.notice{border:1px dashed rgba(157,180,214,.35);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#c9d4e4}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--sim)}
.notice.err{border-color:rgba(224,122,106,.45);color:#f0c2b9}
.notice.err svg{color:var(--bad)}
.notice.gold{border-color:var(--line);color:var(--ivory)}
.notice.gold svg{color:var(--gold)}

.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:128px;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.mini{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.mini .thumb{aspect-ratio:3/4;width:100%}
.mini b{font-family:var(--display);font-weight:500;font-size:15px;line-height:1.2}
.mini small{color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}

/* Fles-afbeelding */
.thumb{border-radius:12px;background:radial-gradient(80% 60% at 50% 35%,#2b261b,#141210 75%);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;max-width:100%}
.thumb svg{width:78%;height:auto}
.thumb img{width:100%;height:100%;object-fit:cover}

/* Lijsten */
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:0 16px;min-height:48px;background:var(--panel)}
.search svg{width:18px;height:18px;color:var(--gold);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:7px 13px;font-size:13px;white-space:nowrap;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(201,164,92,.12);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item .thumb{width:64px;height:80px}
.item .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.item .name{font-family:var(--display);font-size:18px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.item .sub{font-size:12.5px;color:var(--muted)}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--gold)}
.stars-ro{color:var(--gold);letter-spacing:2px;font-size:12px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .thumb{aspect-ratio:4/5;width:100%;position:relative}
.card .badge{position:absolute;top:8px;left:8px}
.card .brand{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card b{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.2}
.card small{color:var(--muted);font-size:12px}
.empty{border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:34px;height:34px;color:var(--gold)}
.empty b{font-family:var(--display);font-size:20px;font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
select.sel{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 32px 8px 14px;font-size:13px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}

/* Detail */
.pd-hero{display:grid;grid-template-columns:1fr;gap:18px}
.pd-stage{position:relative;border-radius:20px;border:1px solid var(--line);aspect-ratio:1/1;max-height:340px;width:100%;background:
  radial-gradient(55% 45% at 50% 42%,rgba(234,211,155,.18),transparent 70%),
  linear-gradient(180deg,#1d1a13,#0f0e0b);display:grid;place-items:center;overflow:hidden}
.pd-stage svg{height:78%;width:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6));animation:float 6s ease-in-out infinite}
.pd-stage img{width:100%;height:100%;object-fit:cover}
.pd-stage .cap{position:absolute;bottom:10px;right:12px;font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.pd-stage .tl{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pd-title .brand{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.pd-title h2{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.05;margin:4px 0 8px;text-wrap:balance;overflow-wrap:anywhere}
.pd-title .facts{font-size:13px;color:var(--muted)}
.fam{display:inline-flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.fam i{width:10px;height:10px;border-radius:50%;display:inline-block}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pyramid{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tier{display:grid;grid-template-columns:108px 1fr;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}
.tier .lab b{display:block;font-family:var(--display);font-weight:500;font-size:16px}
.tier .lab small{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tier .notes{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-width:0}
.note{font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(201,164,92,.10);color:var(--gold-hi)}
.tier:nth-child(1){background:linear-gradient(90deg,rgba(234,211,155,.06),transparent)}
.tier:nth-child(3){background:linear-gradient(90deg,rgba(120,90,40,.12),transparent)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;padding:4px;color:var(--dim);transition:transform .15s,color .2s}
.stars button svg{width:30px;height:30px}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(.88)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ivory);width:100%;min-width:0}
.inp:focus{outline:0;border-color:var(--gold)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45}
.inp.invalid{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12.5px;text-transform:none;letter-spacing:0}
.hint{font-size:12px;color:var(--dim);text-transform:none;letter-spacing:0}
.form{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}

/* Scan */
.viewfinder{position:relative;border-radius:22px;border:1px solid var(--line);aspect-ratio:4/5;max-height:360px;width:100%;overflow:hidden;background:#090807;display:grid;place-items:center}
.viewfinder img{width:100%;height:100%;object-fit:cover}
.viewfinder .frame{position:absolute;inset:16%;border-radius:14px;pointer-events:none}
.viewfinder .frame::before,.viewfinder .frame::after{content:"";position:absolute;width:34px;height:34px;border:2px solid var(--gold)}
.viewfinder .frame::before{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
.viewfinder .frame::after{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.viewfinder .laser{position:absolute;left:16%;right:16%;height:2px;top:20%;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);box-shadow:0 0 12px var(--gold);animation:laser 2.4s ease-in-out infinite}
@keyframes laser{0%,100%{top:20%}50%{top:78%}}
.viewfinder .vf-text{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--muted);padding:0 16px}
.vf-empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--dim);text-align:center;padding:20px}
.vf-empty svg{width:42px;height:42px;color:var(--gold)}
.steps{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px}
.steps .st{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps .st i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.steps .st.run i{background:var(--gold);animation:pulse 1s infinite}
.steps .st.done i{background:var(--ok)}
.steps .st.fail i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.result{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;border:1px solid var(--gold);border-radius:var(--r);padding:12px;background:linear-gradient(120deg,#231d11,var(--panel))}
.result .thumb{width:84px;height:104px}
.result .meta{min-width:0}
.demo-codes{display:flex;flex-direction:column;gap:10px}
.code-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
.code-row svg{width:120px;height:auto;background:#fff;border-radius:4px;padding:4px}
.code-row .meta{min-width:0;font-size:13px}
.code-row .meta b{display:block;font-family:var(--display);font-weight:500;font-size:15px;overflow-wrap:anywhere}
.code-row code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* Profiel & lab */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:14px 10px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--gold-hi)}
.stat small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu>*{display:flex;align-items:center;gap:12px;padding:14px;border:0;border-bottom:1px solid rgba(201,164,92,.12);background:none;text-align:left;width:100%;min-width:0}
.menu>*:last-child{border-bottom:0}
.menu .mi{flex:1;min-width:0}
.menu .mi b{display:block;font-weight:500}
.menu .mi small{color:var(--muted);font-size:12.5px}
.menu svg.chev{width:16px;height:16px;color:var(--dim)}
.status-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.status-list>div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(201,164,92,.12);font-size:13.5px}
.status-list>div:last-child{border-bottom:0}
.status-list small{display:block;color:var(--dim);font-size:12px}
.arch{display:flex;flex-direction:column;gap:6px}
.layer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--panel)}
.layer b{font-weight:500}
.layer small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.layer code{font-family:var(--mono);font-size:11.5px;color:var(--gold)}
.arrow{align-self:center;color:var(--dim);font-family:var(--mono);font-size:12px}
.device{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.device .led{width:10px;height:10px;border-radius:50%;background:var(--dim)}
.device .led.on{background:var(--sim);box-shadow:0 0 10px var(--sim)}
.device .meta{min-width:0}
.device .meta small{display:block;color:var(--muted);font-size:12px}
.radar-wrap{position:relative;border:1px solid rgba(157,180,214,.3);border-radius:var(--r);padding:10px;background:repeating-linear-gradient(135deg,rgba(157,180,214,.04) 0 10px,transparent 10px 20px)}
.radar-wrap svg{width:100%;height:auto;display:block}
.radar-wrap .wm{position:absolute;top:10px;right:10px}
.log{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:#080706;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .ts{color:var(--dim)}
.log .s{color:var(--sim)}
pre.json{font-family:var(--mono);font-size:11px;color:#c9d4e4;background:#080706;border:1px solid rgba(157,180,214,.3);border-radius:10px;padding:10px;max-height:220px;overflow:auto;margin:0;white-space:pre}

/* Sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:linear-gradient(180deg,#1e1a12,var(--panel));border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.sheet h3{font-family:var(--display);font-weight:500;font-size:24px;margin:0;text-wrap:balance}
.hw-icon{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;align-self:center;color:var(--gold);background:radial-gradient(circle,rgba(201,164,92,.15),transparent 70%)}
.hw-icon svg{width:34px;height:34px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(440px,calc(100% - 32px));background:var(--ivory);color:var(--ink);border-radius:99px;padding:11px 18px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .25s}
.toast.err{background:#3a1c17;color:#ffd9d1;border:1px solid var(--bad)}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Geurgeheugen v1.0 */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px;background:var(--panel)}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:0;border-radius:99px;background:transparent;color:var(--muted);font-size:13.5px;letter-spacing:.04em;transition:background .2s,color .2s}
.seg button svg{width:17px;height:17px;pointer-events:none}
.seg button[aria-pressed="true"]{background:linear-gradient(145deg,var(--gold-hi),var(--gold) 60%,#a9853e);color:var(--ink)}
.kvs{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(201,164,92,.12);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--gold);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv>span:last-child{min-width:0;overflow-wrap:anywhere}
.radar-wrap.gold{border-color:var(--line);background:repeating-linear-gradient(135deg,rgba(201,164,92,.035) 0 10px,transparent 10px 20px)}
.meas{display:flex;flex-direction:column;gap:10px}
.meas details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 12px}
.meas details[open]{padding-bottom:12px}
.meas details>*:not(summary){margin-top:10px}
.meas summary{display:flex;align-items:center;gap:12px;min-height:56px;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
.meas summary::-webkit-details-marker{display:none}
.meas summary *{pointer-events:none}
.mmeta{display:flex;flex-direction:column;min-width:0;font-size:14px}
.mmeta small{color:var(--muted);font-size:12px}
.score-card{border:1px solid var(--gold);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(140deg,#231d11,var(--panel) 70%)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.score b small{font-size:26px;margin-left:2px}
.score span{color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{font-size:13px;display:flex;flex-direction:column;gap:5px}
.bar .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.track{height:6px;border-radius:6px;background:rgba(201,164,92,.14);overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp-col{min-width:0;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--panel)}
.cmp-col .thumb{aspect-ratio:4/5;width:100%}
.cmp-col .brand{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.cmp-col b{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.cmp-notes{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cmp-notes small{width:100%;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cmp-notes .note{font-size:12px;padding:3px 8px;overflow-wrap:anywhere}
.note.shared{background:var(--gold);color:var(--ink)}
.fam.sm{font-size:12px;padding:4px 9px;align-self:flex-start}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px;min-width:0}
.lg{width:18px;height:3px;border-radius:2px;display:inline-block}
.lg.gold{background:var(--gold)}
.lg.ivory{background:repeating-linear-gradient(90deg,var(--ivory) 0 4px,transparent 4px 7px)}
.simscore{font-family:var(--display);font-weight:500;font-size:22px;color:var(--sim);font-variant-numeric:tabular-nums}
/* Geurherkenning 1.0 */
.seg.sm button{min-height:34px;font-size:12.5px}
.seg button[disabled]{opacity:.5}
.sensor-card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,var(--panel-2),var(--panel));padding:14px;display:flex;flex-direction:column;gap:12px}
.sensor-status{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sensor-status .meta{min-width:0}
.sensor-status b{display:block;font-weight:500;font-size:14.5px}
.sensor-status small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.led{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.led.sim{background:var(--sim);box-shadow:0 0 10px var(--sim);animation:pulse 2.4s ease-in-out infinite}
.led.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.led.wait{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulse 1s infinite}
.led.err{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.nose-stage{position:relative;width:100%;height:clamp(270px,84vw,360px);border-radius:22px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;background:radial-gradient(55% 50% at 50% 48%,rgba(201,164,92,.16),transparent 70%),linear-gradient(180deg,#15120c,#090807)}
.nose-stage .cap-tl{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.nose-stage .cap-b{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--muted);padding:0 16px;z-index:2}
.orb{position:relative;width:min(230px,60vw);aspect-ratio:1/1;margin-top:-14px}
.orb>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orb .prog{transition:stroke-dashoffset .45s ease}
.orb .r1,.orb .r2{transform-box:fill-box;transform-origin:center}
.orb .r1{animation:spin 22s linear infinite}
.orb .r2{animation:spin 14s linear infinite reverse}
.orb .sweep{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 66%,rgba(234,211,155,.06) 78%,rgba(234,211,155,.45) 100%);-webkit-mask:radial-gradient(circle,transparent 34%,#000 35%);mask:radial-gradient(circle,transparent 34%,#000 35%);animation:spin 4s linear infinite;opacity:.3}
.orb .core{position:absolute;inset:31%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 32%,#3b301b,#120f0a 72%);border:1px solid rgba(201,164,92,.55);box-shadow:0 0 30px rgba(201,164,92,.22),inset 0 0 18px rgba(201,164,92,.18);color:var(--gold-hi);animation:breathe 4s ease-in-out infinite}
.orb .core svg{width:44%;height:44%}
.orb .pct{font-family:var(--display);font-size:28px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.nose-stage.run .orb .sweep{opacity:1;animation-duration:1.3s}
.nose-stage.run .orb .r1{animation-duration:6s}
.nose-stage.run .orb .r2{animation-duration:3.5s}
.nose-stage.run .orb .core{animation-duration:1.6s}
.nose-stage.done .orb .core{border-color:var(--gold-hi);box-shadow:0 0 46px rgba(234,211,155,.4),inset 0 0 22px rgba(201,164,92,.3);animation:none}
@keyframes breathe{50%{box-shadow:0 0 52px rgba(201,164,92,.42),inset 0 0 24px rgba(201,164,92,.3);transform:scale(1.035)}}
.nose-stage .mote{position:absolute;bottom:16%;width:4px;height:4px;border-radius:50%;background:var(--gold-hi);opacity:0;box-shadow:0 0 8px var(--gold);animation:mote 5.2s ease-in infinite;pointer-events:none}
.nose-stage.run .mote{animation-duration:2.1s}
.nose-stage.done .mote{display:none}
@keyframes mote{0%{opacity:0;transform:translate(0,0) scale(.6)}18%{opacity:.85}100%{opacity:0;transform:translate(var(--dx,0),-190px) scale(1.25)}}
.progress{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.progress .track{height:4px}
.track.sim i{background:linear-gradient(90deg,#7f97bb,var(--sim))}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.chk b{display:block;font-weight:500}
.chk small{display:block;color:var(--muted);font-size:12.5px}
.match-score{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.match-score b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.match-score b.sim{color:var(--sim)}
.match-score small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ch-bars{display:flex;align-items:flex-end;gap:3px;height:120px;border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 4px;background:var(--panel)}
.ch-bars .cb{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.ch-bars .cb i{display:block;width:100%;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}
.ch-bars .cb small{font-family:var(--mono);font-size:8.5px;color:var(--dim)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ch-grid span{border:1px solid rgba(201,164,92,.14);border-radius:8px;padding:5px 7px;overflow-wrap:anywhere}
.ch-grid b{display:block;color:var(--gold);font-weight:500}
.ch-grid small{color:var(--dim)}
@media (max-width:360px){.seg button{font-size:12.5px;gap:6px;letter-spacing:0}.seg button svg{width:15px;height:15px}}
a.btn{text-decoration:none}
/* ---- 0.5: Echte sensor ---- */
.actions.fit{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.actions.fit .btn{min-width:0;padding:0 14px}
.src-list{display:flex;flex-direction:column;gap:8px}
.src{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);color:inherit;font:inherit;cursor:pointer;min-height:44px}
.src[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(160deg,var(--panel-2),var(--panel));box-shadow:inset 0 0 0 1px rgba(201,164,92,.35)}
.src:disabled{opacity:.45;cursor:default}
.src .ic{color:var(--gold);display:flex}.src .ic svg{width:22px;height:22px}
.src .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.src .meta b{font-weight:500}
.src .meta small{color:var(--muted);font-size:12px;line-height:1.35}
.src .meta small.ok{color:var(--ok)}.src .meta small.no{color:var(--dim)}
.rs-kvs .kv{grid-template-columns:112px 1fr;font-size:13px;padding:9px 12px}
.qbar{display:inline-block;width:64px;height:6px;border-radius:6px;background:rgba(201,164,92,.14);overflow:hidden;vertical-align:middle}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.mono{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.rs-prompt{border:1px solid var(--gold);border-radius:var(--r);padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px;background:radial-gradient(circle at 50% 0,rgba(201,164,92,.16),transparent 70%)}
.rs-prompt:empty{display:none}
.rs-prompt b{font-family:var(--display);font-size:22px;font-weight:500;color:var(--ivory)}
.rs-prompt span{font-size:13px;color:var(--muted)}
.q-card{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.q-card.err{border-color:rgba(224,122,106,.45)}
.q-score{display:flex;flex-direction:column;align-items:center;min-width:64px}
.q-score b{font-family:var(--display);font-size:40px;line-height:1;color:var(--gold-hi);font-weight:500}
.q-card.err .q-score b{color:var(--bad)}
.q-score small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.q-meta{min-width:0}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.issues li{padding:8px 10px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.issues li.reject{border-color:rgba(224,122,106,.45);color:#f0c2b9}
.issues li.warn{border-color:rgba(224,180,90,.4);color:var(--warn)}
.unknown{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.unknown b{font-family:var(--display);font-size:24px;font-weight:500;color:var(--ivory)}
.unknown span{font-size:13px;color:var(--muted)}
.expl{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ch-bars.live{height:84px}

class CloudStore {
  constructor(db, userId) { this.db = db; this.col = db.collection("data/users/" + userId); this.kind = "account"; this.label = "In je Claude-account (privé)"; this.queue = Promise.resolve(); }

  _enqueue(fn) { this.queue = this.queue.then(fn, fn); return this.queue; } /* één schrijfactie tegelijk */
  put(k, v) { return this._enqueue(() => this.col.doc(k).set({ payload: v, updatedAt: Date.now() })); }
  remove(k) { return this._enqueue(() => this.col.doc(k).delete()); }
  async clear() { const all = await this.loadAll(); for (const k of Object.keys(all)) await this.remove(k); }

const Library = {

  async connectCloud() {

    try {
      const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      const cloud = new CloudStore(db, id);
      const remote = await cloud.loadAll();
      const localAll = await this.local.loadAll();
      if (Object.keys(remote).length === 0 && Object.keys(localAll).length) {
        for (const [k, v] of Object.entries(localAll)) await cloud.put(k, v); /* eerste keer: lokale data meenemen */

        for (const [k, v] of Object.entries(localAll)) { /* samenvoegen: nieuwste wint */

  async seedExamples() {
    const ex = [
      { id: "chanel-n5", rating: 4, comment: "Voorbeeld: getest in de winkel, sterk aldehyde-begin.", favorite: true, testedOn: "2026-10-12" },
      { id: "mfk-br540", rating: 5, comment: "Voorbeeld: blijft de hele dag hangen.", favorite: false, testedOn: "2026-10-20" },
      { id: "jomalone-wsss", rating: 3, comment: "", favorite: false, testedOn: "2026-09-28" },
    ];
    const listId = "l-zomer";
    this.lists = [{ id: listId, name: "Zomergeuren" }];
    for (const e of ex) {

  async save(perfume) {

  build() {

  _sensorPart() {

  parse(text) {

    if (!d || d.schema !== "scentphone.backup") throw new Error("Dit bestand is geen ScentPhone-back-up.");

        family: FAMILIES.some((f) => f.id === p.family) ? p.family : "", top: strList(p.top), heart: strList(p.heart), base: strList(p.base), description: str(p.description, 1000),
        barcode: /^\d{6,14}$/.test(p.barcode || "") ? p.barcode : "", image,
        bottle: p.bottle && typeof p.bottle === "object" ? { shape: str(p.bottle.shape, 20), liquid: /^#[0-9a-f]{3,8}$/i.test(p.bottle.liquid || "") ? p.bottle.liquid : "#c9a45c", cap: /^#[0-9a-f]{3,8}$/i.test(p.bottle.cap || "") ? p.bottle.cap : "#1a1a1a" } : undefined,

/* ---------- ScentRecognitionEngine ---------- */
/** Vergelijkt een meting met opgeslagen geurprofielen. Eenvoudige, uitlegbare methode; de score is een
 *  relatieve vergelijkingsscore binnen de eigen bibliotheek, géén bewezen nauwkeurigheid of trefkans.
 *  - Demo/gekalibreerde meting: geurrichtingen (10 assen) vs. kenmerkprofiel uit geurnoten, plus eerdere metingen.
 *  - Ongekalibreerde echte meting: ruwe kanalen vs. referentiemetingen van hetzelfde sensortype (zelfde kanalen). */
const ScentRecognitionEngine = {
  version: "1.0",
  method: "Overeenkomst van geurrichtingen (correlatie + cosinus) en, waar aanwezig, eerdere referentiemetingen",
  _vec(axes) { return AXES.map((a) => ((axes || []).find((x) => x.key === a.key) || { value: 0 }).value); },
  /** Gelijkenis 0..1 van twee vectoren: gemiddelde van cosinus en (positieve) correlatie, zodat de vorm van het profiel telt. */
  similarity(a, b) {
    const n = Math.min(a.length, b.length); if (!n) return 0;
    let d = 0, na = 0, nb = 0, ma = 0, mb = 0;
    for (let i = 0; i < n; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; ma += a[i]; mb += b[i]; }
    const cos = na && nb ? d / Math.sqrt(na * nb) : 0; ma /= n; mb /= n;
    let c = 0, va = 0, vb = 0; for (let i = 0; i < n; i++) { c += (a[i] - ma) * (b[i] - mb); va += (a[i] - ma) ** 2; vb += (b[i] - mb) ** 2; }
    const r = va && vb ? c / Math.sqrt(va * vb) : cos;
    return clamp01((Math.max(0, cos) + Math.max(0, r)) / 2);
  },
  signature(m) { return (m.channels || []).map((c) => c.id).join("|") + "#" + ((m.device && m.device.model) || ""); },
  calibrated(m) { return !m.uncalibrated && (m.axes || []).some((a) => a.value > 0); },
  /** Opgeslagen metingen bij dit parfum die met de nieuwe meting vergelijkbaar zijn. */
  references(perfume, m) {
    const ms = ScentMemory.measurements(perfume).filter((x) => x.id !== m.id);
    if (m.source === "sensor") return ms.filter((x) => x.source === "sensor" && x.channels.length && this.signature(x) === this.signature(m));
    return ms.filter((x) => x.source === "simulated");
  },
  scoreFor(m, perfume) {
    const parts = [], refs = this.references(perfume, m), tr = ScentMemory.traits(perfume);
    if (m.source === "sensor") {
      if (refs.length) parts.push({ key: "ref", label: "Referentiemetingen met deze sensor", weight: 0.8, value: Math.max(...refs.map((x) => this.similarity(m.channels.map((c) => c.value), x.channels.map((c) => c.value)))) });
      if (this.calibrated(m) && tr) parts.push({ key: "traits", label: "Kenmerkprofiel uit geurnoten", weight: 0.2, value: this.similarity(this._vec(m.axes), this._vec(tr.axes)) });
    } else {
      if (tr) parts.push({ key: "traits", label: "Kenmerkprofiel uit geurnoten", weight: 0.7, value: this.similarity(this._vec(m.axes), this._vec(tr.axes)) });
      const sims = refs.filter((x) => this.calibrated(x));
      if (sims.length && tr) parts.push({ key: "ref", label: "Eerder opgeslagen demo-metingen", weight: 0.3, value: sims.reduce((s, x) => s + this.similarity(this._vec(m.axes), this._vec(x.axes)), 0) / sims.length });
    }
    if (!parts.length) return null;
    const w = parts.reduce((s, p) => s + p.weight, 0);
    return { score: Math.round((parts.reduce((s, p) => s + p.weight * p.value, 0) / w) * 100), parts, refs: refs.length };
  },
  /** Geurkenmerken van een meting: sterkste geurrichtingen en mogelijke geurfamilie. */
  features(m) {
    if (!this.calibrated(m)) return { axes: [], families: [], raw: true };
    const level = (v) => (v >= 0.7 ? "Sterk" : v >= 0.45 ? "Duidelijk" : v >= 0.2 ? "Licht" : "Spoor");
    const axes = m.axes.filter((a) => a.value >= 0.08).sort((a, b) => b.value - a.value).slice(0, 5).map((a) => ({ ...a, level: level(a.value) }));
    return { axes, families: this.familyGuess(m), raw: false };
  },
  /** Prototype per geurfamilie = gemiddeld kenmerkprofiel van bekende parfums in die familie (catalogus + bibliotheek). */
  familyGuess(m) {
    const v = this._vec(m.axes), seen = new Set(), sum = {};
    [...Library.all(), ...CATALOG].forEach((p) => { if (seen.has(p.id) || !p.family) return; seen.add(p.id); const tr = ScentMemory.traits(p); if (!tr) return; const s = sum[p.family] || (sum[p.family] = { n: 0, v: AXES.map(() => 0) }); s.n++; this._vec(tr.axes).forEach((x, i) => (s.v[i] += x)); });
    return FAMILIES.map((f) => { const s = sum[f.id]; const proto = s ? s.v.map((x) => x / s.n) : AXES.map((a) => (FAMILY_BIAS[f.id] || {})[a.key] || 0); return { family: f, score: Math.round(this.similarity(v, proto) * 100) }; })
      .sort((a, b) => b.score - a.score).slice(0, 2);
  },
  qualify(score) { return score >= 85 ? "Sterke overeenkomst" : score >= 70 ? "Duidelijke overeenkomst" : score >= 50 ? "Enige overeenkomst" : "Zwakke overeenkomst"; },
  recognize(m, opts = {}) {
    const pool = opts.pool || Library.all();
    const scored = pool.map((p) => { const r = this.scoreFor(m, p); return r ? { perfume: p, ...r } : null; }).filter(Boolean).sort((a, b) => b.score - a.score);
    return { engine: this.version, method: this.method, source: m.source, matches: scored.slice(0, opts.limit || 5), considered: scored.length, skipped: pool.length - scored.length, features: this.features(m), noReferences: m.source === "sensor" && !scored.length };
  },
};

function eanSVG(code) {
  const L = ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"];
  const R = L.map((s) => [...s].map((c) => (c === "0" ? "1" : "0")).join(""));

  [...bits].forEach((b, i) => { if (b === "1") rects += `<rect x="${x + i}" y="2" width="1" height="${guard.has(i) ? 46 : 40}" fill="#000"/>`; });

  let rings = ""; [0.25, 0.5, 0.75, 1].forEach((k) => { rings += `<polygon points="${profile.axes.map((_, i) => pt(i, k).join(",")).join(" ")}" fill="none" stroke="rgba(201,164,92,${k === 1 ? .35 : .15})"/>`; });
  let spokes = "", labels = "";
  profile.axes.forEach((a, i) => { const [x, y] = pt(i, 1); spokes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(201,164,92,.12)"/>`; const [lx, ly] = pt(i, 1.2); const anchor = Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end"; labels += `<text x="${lx}" y="${ly + 4}" text-anchor="${anchor}" font-family="Jost,sans-serif" font-size="11" fill="#a39b86">${esc(a.label)}</text>`; });
  const TONES = { sim: ["rgba(157,180,214,.22)", "#9db4d6", "#c9d6ea"], gold: ["rgba(201,164,92,.24)", "#c9a45c", "#ead39b"], ivory: ["rgba(246,242,233,.10)", "#f6f2e9", "#f6f2e9"] };
  const shape = (axes, tone, dash) => {
    const [fill, stroke, dot] = TONES[tone] || TONES.sim; const val = (k) => (axes.find((x) => x.key === k) || { value: 0 }).value;
    const poly = profile.axes.map((a, i) => pt(i, val(a.key)).join(",")).join(" ");
    const dots = profile.axes.map((a, i) => { const [x, y] = pt(i, val(a.key)); return `<circle cx="${x}" cy="${y}" r="2.6" fill="${dot}"/>`; }).join("");
    return `<polygon points="${poly}" fill="${fill}" stroke="${stroke}" stroke-width="1.6" ${dash ? 'stroke-dasharray="4 3"' : ""}/>${dots}`;
  };
  const second = opts.compare ? shape(opts.compare.axes, opts.compareTone || "ivory", true) : "";
  return `<svg viewBox="-44 0 408 300" role="img" aria-label="${esc(opts.label || "Geurprofiel")}">${rings}${spokes}${shape(profile.axes, opts.tone || "sim")}${second}${labels}</svg>`;
}

/* ---------------------------- UI ----------------------------------- */
const UI = {
  stack: [{ name: "home" }], tab: "home", transient: new Map(), scan: { state: "idle" }, scanView: "bottle",
  scent: { mode: "demo", sample: "", blind: false, running: false, pct: 0, steps: [], result: null, error: "", run: 0, ctrl: null }, filters: { lib: { q: "", fam: "", list: "all", sort: "recent" }, disc: { q: "", fam: "" } },
  go(name, params = {}) { this.stack.push({ name, params }); this.render(); },
  back() { if (this.stack.length > 1) { this.stack.pop(); this.render(); } },
  switchTab(tab) { this.tab = tab; this.stack = [{ name: tab }]; this.render(); },
  get cur() { return this.stack[this.stack.length - 1]; },
  toast(msg, err = false) { const h = $("#toastHost"); h.innerHTML = `<div class="toast ${err ? "err" : ""}" role="status">${esc(msg)}</div>`; clearTimeout(this._tt); this._tt = setTimeout(() => (h.innerHTML = ""), err ? 4800 : 2600); },
  sheet(html, bind) {
    const o = $("#overlay"); o.innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
    const close = () => (o.innerHTML = "");
    o.querySelector(".scrim").addEventListener("click", (e) => { if (e.target.hasAttribute("data-close") || e.target.closest("[data-dismiss]")) close(); });
    if (bind) bind(o.querySelector(".sheet"), close);
    const f = o.querySelector("input,button:not([data-dismiss])"); f && setTimeout(() => f.focus(), 50);
    return close;
  },
  confirm(title, msg, okLabel, onOk, danger = true) {
    this.sheet(`<h3>${esc(title)}</h3><p class="muted">${esc(msg)}</p><div class="actions"><button class="btn ghost" data-dismiss>Annuleren</button><button class="btn ${danger ? "danger" : "primary"}" id="cfOk">${esc(okLabel)}</button></div>`,
      (s, close) => { $("#cfOk", s).onclick = async () => { close(); await onOk(); }; });
  },
  findPerfume(id) { return Library.get(id) || this.transient.get(id) || CATALOG.find((p) => p.id === id) || null; },

  render() {
    const c = this.cur, isRoot = this.stack.length === 1;
    const screen = Screens[c.name] || Screens.home;
    const out = screen(c.params || {});
    const tb = $("#topbar");
    tb.innerHTML = isRoot
      ? `<div class="brandmark"><img class="emb" src="${LOGO.emblem}" alt="" width="70" height="96"><img class="wm" src="${LOGO.wordmark}" alt="ScentPhone" width="426" height="64"></div><span class="pill sim" title="Geurhardware wordt gesimuleerd">${ICON.chip.replace("<svg", '<svg width="12" height="12"')} Prototype</span>${out.headerRight || ""}`
      : `<button class="back" aria-label="Terug" id="backBtn">${ICON.back}</button><h1>${esc(out.title || "")}</h1>${out.headerRight || ""}`;
    if (!isRoot) $("#backBtn").onclick = () => this.back();
    const main = $("#main");
    main.innerHTML = `<div class="view">${out.html}</div>`;
    main.scrollTop = 0; tb.classList.remove("scrolled");
    this.renderTabs();
    /* Eén fout in een scherm mag de rest van de bediening nooit meer blokkeren */
    try { out.bind && out.bind(main, tb); } catch (e) { console.error("ScentPhone: scherm koppelen mislukt", e); }
  },
  renderTabs() {
    const tabs = [["home", ICON.home, t("tab_home")], ["library", ICON.lib, t("tab_lib")], ["scan", ICON.scan, t("tab_scan")], ["discover", ICON.disc, t("tab_disc")], ["profile", ICON.user, t("tab_prof")]];
    $("#tabbar").innerHTML = tabs.map(([id, ic, lab]) => `<button class="tab ${id === "scan" ? "scan" : ""}" data-tab="${id}" ${this.tab === id ? 'aria-current="page"' : ""}>${id === "scan" ? `<span class="ring">${ic}</span>` : ic}<span>${esc(lab)}</span></button>`).join("");
    $$("#tabbar .tab").forEach((b) => (b.onclick = () => this.switchTab(b.dataset.tab)));
  },
};
$("#main").addEventListener("scroll", (e) => $("#topbar").classList.toggle("scrolled", e.target.scrollTop > 4), { passive: true });

const starsRO = (n) => (n ? "★".repeat(n) + "☆".repeat(5 - n) : "");
function itemRow(p) {
  const f = famOf(p.family);
  return `<button class="item" data-open="${esc(p.id)}"><div class="thumb">${visual(p)}</div><div class="meta"><span class="brand">${esc(p.brand)}</span><span class="name">${esc(p.name)}</span><span class="sub">${esc(f.label)} · getest ${esc(fmtDate(p.testedOn))}${p.example ? " · voorbeeld" : ""}</span></div><div class="end">${p.favorite ? ICON.heartF.replace("<svg", '<svg width="18" height="18"') : ""}<span class="stars-ro">${starsRO(p.rating)}</span></div></button>`;
}
/* Parfums openen via één gedelegeerde handler op het hoofdpaneel: werkt voor elke kaart, rij en resultaat, ook als een scherm opnieuw wordt opgebouwd. */
function bindOpen() { /* bewust leeg: zie gedelegeerde handler hieronder */ }
$("#main").addEventListener("click", (e) => {
  const seg = e.target.closest("[data-libview]");
  if (seg && $("#main").contains(seg)) { UI.libView = seg.dataset.libview; UI.render(); return; }
  const sv = e.target.closest("[data-scanview]");
  if (sv && $("#main").contains(sv)) { if ((UI.scent.running || UI.rs.running) && sv.dataset.scanview !== "scent") { UI.toast("Stop eerst de lopende meting."); return; } UI.scanView = sv.dataset.scanview; UI.render(); return; }
  const mem = e.target.closest("[data-mem]");
  if (mem && $("#main").contains(mem)) { if (Library.has(mem.dataset.mem)) UI.go("memory", { id: mem.dataset.mem }); else UI.toast("Dit geurprofiel kon niet worden gevonden.", true); return; }
  const el = e.target.closest("[data-open]");
  if (!el || !$("#main").contains(el)) return;
  const id = el.dataset.open;
  if (!UI.findPerfume(id)) { UI.toast("Dit parfum kon niet worden gevonden. Het is mogelijk verwijderd.", true); return; }
  UI.go("perfume", { id });
});

      <div class="notice">${ICON.info}<div><b>Prototype.</b> Scannen, herkennen, de bibliotheek en opslag werken echt. Geur meten en geur afspelen zijn demonstraties met gesimuleerde gegevens; daarvoor is toekomstige ScentPhone-hardware nodig.</div></div>`,

      result = `<section class="section"><span class="eyebrow">${s.via === "ai" ? "Herkend met beeldherkenning" : s.via === "ocr" ? "Herkend via tekst op het etiket" : "Gevonden via barcode"}</span>
        <button class="result" data-open="${esc(p.id)}" style="text-align:left;color:inherit"><div class="thumb">${visual(p)}</div><div class="meta"><span class="eyebrow" style="font-size:10.5px">${esc(p.brand)}</span><div style="font-family:var(--display);font-size:22px;line-height:1.15">${esc(p.name)}</div><div class="small muted">${esc(famOf(p.family).label)}${p.concentration ? " · " + esc(p.concentration) : ""}</div>${s.confidence != null ? `<div class="small" style="margin-top:4px;color:var(--warn)">Zekerheid ${Math.round(s.confidence * 100)}% — controleer de gegevens</div>` : ""}</div></button>

        <div class="demo-codes">${CATALOG.slice(0, 5).map((p) => `<div class="code-row">${eanSVG(p.barcode)}<div class="meta"><b>${esc(p.brand)} ${esc(p.name)}</b><code>${p.barcode}</code></div><button class="btn sm ghost" data-code="${p.barcode}">Gebruik</button></div>`).join("")}</div>

        $("#toManual", m) && ($("#toManual", m).onclick = () => UI.go("form", { prefill: { barcode: UI.scan.code || "", image: UI.scan.thumb || null } }));

        $$("[data-code]", m).forEach((b) => (b.onclick = () => Scanner.byCode(b.dataset.code)));
        $("#moreCodes", m).onclick = () => UI.sheet(`<h3>Demo-barcodes</h3><div class="demo-codes">${CATALOG.map((p) => `<div class="code-row">${eanSVG(p.barcode)}<div class="meta"><b>${esc(p.brand)} ${esc(p.name)}</b><code>${p.barcode}</code></div><button class="btn sm ghost" data-code2="${p.barcode}" data-dismiss>Gebruik</button></div>`).join("")}</div>`, (s) => $$("[data-code2]", s).forEach((b) => b.addEventListener("click", () => Scanner.byCode(b.dataset.code2))));

  library() {
    if (UI.libView === "memory") return Screens.memoryList();
    const f = UI.filters.lib;
    let items = Library.all();
    const q = norm(f.q);
    if (q) items = items.filter((p) => norm([p.brand, p.name, famOf(p.family).label, ...(p.top || []), ...(p.heart || []), ...(p.base || [])].join(" ")).includes(q));

      ${items.length ? `<div class="grid2">${items.map((p) => `<button class="card" data-open="${p.id}"><div class="thumb">${visual(p)}${Library.has(p.id) ? `<span class="pill badge ok">Bewaard</span>` : ""}</div><span class="brand">${esc(p.brand)}</span><b>${esc(p.name)}</b><small>${esc(famOf(p.family).label)} · ${p.year}</small></button>`).join("")}</div>`
