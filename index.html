  perfume({ id }) {
    const p = UI.findPerfume(id);
    if (!p) return { title: "Niet gevonden", html: `<div class="empty">${ICON.alert}<b>Dit parfum bestaat niet meer</b><p class="muted small">Het is mogelijk verwijderd.</p></div>` };
    const saved = Library.has(p.id), fam = famOf(p.family);
    const facts = [p.concentration, p.year, p.perfumer && "Parfumeur: " + p.perfumer].filter(Boolean).map(esc).join(" · ");
    const tier = (lab, time, notes) => `<div class="tier"><div class="lab"><b>${lab}</b><small>${time}</small></div><div class="notes">${notes && notes.length ? notes.map((n) => `<span class="note">${esc(n)}</span>`).join("") : '<span class="small muted">Niet bekend</span>'}</div></div>`;
    const sp = ScentMemory.measurements(p)[0], nMeas = ScentMemory.measurements(p).length, tr = ScentMemory.traits(p);
    const sourceTag = p.source === "ai" ? `<span class="pill warn">AI-herkend</span>` : p.source === "manual" ? `<span class="pill">Eigen invoer</span>` : p.source === "import" ? `<span class="pill">Geïmporteerd</span>` : p.example ? `<span class="pill">Voorbeeld</span>` : "";
    return {
      title: p.brand,
      headerRight: saved ? `<button class="iconbtn" id="favBtn" aria-label="${p.favorite ? "Verwijder uit favorieten" : "Voeg toe aan favorieten"}" aria-pressed="${!!p.favorite}">${p.favorite ? ICON.heartF : ICON.heart}</button>` : "",
      html: `
      <div class="pd-hero">
        <div class="pd-stage">${visual(p)}<div class="tl">${sourceTag}</div>${p.image ? "" : '<span class="cap">Illustratie</span>'}</div>
        <div class="pd-title"><div class="brand">${esc(p.brand)}</div><h2>${esc(p.name)}</h2><div class="facts">${facts}</div></div>
        <div class="row wrap"><span class="fam"><i style="background:${fam.color}"></i>${esc(fam.label)}</span>${p.barcode ? `<span class="small muted" style="font-family:var(--mono)">EAN ${esc(p.barcode)}</span>` : ""}</div>
        <div class="actions">
          <button class="btn ${saved ? "ghost" : "primary"}" id="saveBtn" ${saved ? "disabled" : ""}>${saved ? ICON.check + " " + t("saved") : ICON.bookmark + " " + t("save")}</button>
          <button class="btn" id="smellBtn">${ICON.wave} ${t("smell")}</button>
        </div>
      </div>
      ${p.source === "ai" ? `<div class="notice warn" style="border-color:rgba(224,180,90,.4)">${ICON.alert}<div>Deze gegevens komen uit beeldherkenning en kunnen onjuist zijn. Controleer ze en pas aan waar nodig.</div></div>` : ""}
      <section class="section"><h2 class="sec">Geurpiramide</h2><div class="pyramid">${tier(t("top"), "0–15 min", p.top)}${tier(t("heart"), "15 min–3 uur", p.heart)}${tier(t("base"), "3 uur en later", p.base)}</div></section>
      ${p.description ? `<section class="section"><h2 class="sec">Beschrijving</h2><p class="muted" style="max-width:62ch">${esc(p.description)}</p></section>` : ""}
      ${shopsHTML(p)}
      <section class="section"><h2 class="sec">Mijn indruk</h2>
        ${saved ? `<div class="panel">
          <div><span class="eyebrow">Beoordeling</span><div class="stars" id="stars" role="radiogroup" aria-label="Beoordeling">${[1, 2, 3, 4, 5].map((n) => `<button role="radio" aria-checked="${p.rating === n}" aria-label="${n} van 5" data-r="${n}" class="${p.rating >= n ? "on" : ""}">${p.rating >= n ? ICON.starF : ICON.star}</button>`).join("")}</div></div>
          <label class="f" for="testDate">Getest op<input class="inp" type="date" id="testDate" value="${esc(p.testedOn || "")}" max="${today()}"></label>
          <label class="f" for="comment">Opmerkingen<textarea class="inp" id="comment" maxlength="2000" placeholder="Hoe ruikt het op jouw huid? Hoe lang blijft het hangen?">${esc(p.comment || "")}</textarea><span class="hint" id="cmtState">Wordt automatisch bewaard</span></label>
          <div><span class="eyebrow">Lijsten</span><div class="chips" style="flex-wrap:wrap;margin-top:8px">${Library.lists.map((l) => `<button class="chip" data-tl="${l.id}" aria-pressed="${(p.lists || []).includes(l.id)}">${esc(l.name)}</button>`).join("")}<button class="chip" id="pdNewList">+ Nieuwe lijst</button></div></div>
        </div>` : `<div class="notice gold">${ICON.bookmark}<div>Bewaar dit parfum om een beoordeling, testdatum, opmerkingen en lijsten toe te voegen.</div></div>`}
      </section>
      <section class="section"><div class="row between"><h2 class="sec">Digitaal geurprofiel</h2><span class="pill">Berekend</span></div>
        ${tr ? `<div class="radar-wrap gold">${radarSVG(tr, { tone: "gold", label: "Kenmerkprofiel berekend uit geurnoten" })}<span class="pill wm">Uit opgegeven noten</span></div>
          <p class="small muted">Dit kenmerkprofiel is berekend uit de geurnoten en geurfamilie hierboven. Het is geen meting.</p>`
          : `<div class="notice gold">${ICON.info}<div>Er zijn nog te weinig herkenbare geurnoten om een kenmerkprofiel te berekenen. ${saved ? "Vul noten en geurfamilie aan via Bewerken." : ""}</div></div>`}
        <div class="row between wrap"><span class="small muted">${nMeas ? `${nMeas} ${nMeas === 1 ? "meting" : "metingen"} in je geurgeheugen · laatste ${esc(fmtDate(sp.capturedAt.slice(0, 10)))}` : "Nog geen metingen opgeslagen"}</span>${sp ? `<span class="pill ${sp.source === "sensor" ? "ok" : "sim"}">${sp.source === "sensor" ? "Sensor" : "Simulatie"}</span>` : ""}</div>
        <div class="actions">
          <button class="btn ghost" id="simBtn" ${saved && tr ? "" : "disabled"}>${ICON.chip} Simuleer meting</button>
          <button class="btn ghost" id="memBtn" ${saved ? "" : "disabled"}>${ICON.db} Geurgeheugen</button>
        </div>
        <button class="btn ghost block" id="cmpBtn" ${saved && Library.items.size > 1 ? "" : "disabled"}>${ICON.compare} Vergelijk geuren</button>
        ${saved ? "" : '<span class="hint">Bewaar het parfum eerst; metingen en vergelijkingen horen bij parfums in je bibliotheek.</span>'}
      </section>
      ${saved ? `<div class="actions"><button class="btn ghost" id="editBtn">${ICON.pen} Bewerken</button><button class="btn danger" id="delBtn">${ICON.trash} Verwijderen</button></div>` : ""}`,
      bind(m, tb) {
        $("#saveBtn", m).onclick = () => guardedSave(p, () => UI.render());
        $("#smellBtn", m).onclick = () => smellSheet(p);
        $("#favBtn", tb) && ($("#favBtn", tb).onclick = async () => { await Library.update(p.id, { favorite: !p.favorite }); UI.toast(!p.favorite ? "Toegevoegd aan favorieten" : "Uit favorieten gehaald"); UI.render(); });
        $$("#stars [data-r]", m).forEach((b) => (b.onclick = async () => { const r = +b.dataset.r; await Library.update(p.id, { rating: p.rating === r ? 0 : r }); UI.render(); }));
        const td = $("#testDate", m); td && (td.onchange = async () => { await Library.update(p.id, { testedOn: td.value }); UI.toast("Testdatum bewaard"); });
        const cm = $("#comment", m);
        if (cm) { const st = $("#cmtState", m); const saveC = debounce(async () => { await Library.update(p.id, { comment: cm.value }); st.textContent = "Bewaard"; }, 600); cm.oninput = () => { st.textContent = "Bezig met bewaren…"; saveC(); }; }
        $$("[data-tl]", m).forEach((b) => (b.onclick = async () => { const cur = Library.get(p.id).lists || []; const on = cur.includes(b.dataset.tl); await Library.update(p.id, { lists: on ? cur.filter((x) => x !== b.dataset.tl) : [...cur, b.dataset.tl] }); b.setAttribute("aria-pressed", String(!on)); }));
        $("#pdNewList", m) && ($("#pdNewList", m).onclick = () => newListSheet(async (l) => { await Library.update(p.id, { lists: [...(Library.get(p.id).lists || []), l.id] }); UI.render(); }));
        $("#simBtn", m).onclick = async (e) => {
          const btn = e.currentTarget; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Demo-sensor meet…`;
          try { const s = ScentHardware.sensors()[0]; if (!s.isConnected()) await s.connect(); const prof = await s.measure({ perfume: Library.get(p.id) }); await ScentMemory.addMeasurement(p.id, prof); UI.toast("Gesimuleerde meting bewaard in je geurgeheugen"); UI.render(); }
          catch (err) { UI.toast(err.message || "Simulatie mislukt", true); btn.disabled = false; btn.innerHTML = ICON.chip + " Simuleer meting"; }
        };
        const mb = $("#memBtn", m); if (mb) mb.onclick = () => UI.go("memory", { id: p.id });
        const cb = $("#cmpBtn", m); if (cb) cb.onclick = () => UI.go("compare", { a: p.id });
        $("#editBtn", m) && ($("#editBtn", m).onclick = () => UI.go("form", { editId: p.id }));
        $("#delBtn", m) && ($("#delBtn", m).onclick = () => UI.confirm("Parfum verwijderen?", `${p.brand} ${p.name} wordt met je beoordeling en opmerkingen uit je bibliotheek verwijderd.`, "Verwijderen", async () => { await Library.remove(p.id); UI.toast("Verwijderd"); UI.back(); }));
      },
    };
  },

  form({ editId, prefill = {}, after }) {
    const ed = editId ? Library.get(editId) : null;
    const v = ed || { brand: "", name: "", family: "", concentration: "", top: [], heart: [], base: [], description: "", barcode: "", testedOn: today(), rating: 0, image: null, ...prefill };
    UI._formImage = v.image || null;
    const join = (a) => esc((a || []).join(", "));
    return {
      title: ed ? "Parfum bewerken" : "Parfum toevoegen",
      html: `
      <form class="form" id="pf" novalidate>
        <div class="row"><div class="thumb" id="fImg" style="width:84px;height:104px;flex:none">${UI._formImage ? `<img src="${UI._formImage}" alt="Foto">` : bottleSVG({ shape: "square", liquid: "#c9a45c" })}</div>
          <div class="section" style="gap:8px;flex:1;min-width:0"><span class="small muted">Foto (optioneel)</span><div class="row wrap"><button type="button" class="btn sm ghost" id="fPhoto">${ICON.camera} Foto</button>${UI._formImage ? `<button type="button" class="btn sm ghost" id="fPhotoDel">Verwijder</button>` : ""}</div></div></div>
        <input type="file" id="fFile" accept="image/*" class="vh" tabindex="-1">
        <label class="f" for="fBrand">Merk *<input class="inp" id="fBrand" value="${esc(v.brand)}" autocomplete="off" maxlength="80"><span class="ferr" id="eBrand" hidden></span></label>
        <label class="f" for="fName">Naam *<input class="inp" id="fName" value="${esc(v.name)}" autocomplete="off" maxlength="80"><span class="ferr" id="eName" hidden></span></label>
        <div class="two">
          <label class="f" for="fFam">Geurfamilie<select class="inp" id="fFam"><option value="">Kies…</option>${FAMILIES.map((f) => `<option value="${f.id}" ${v.family === f.id ? "selected" : ""}>${esc(f.label)}</option>`).join("")}</select></label>
          <label class="f" for="fConc">Concentratie<select class="inp" id="fConc">${["", "Parfum", "Extrait de Parfum", "Eau de Parfum", "Eau de Toilette", "Eau de Cologne", "Cologne"].map((c) => `<option ${v.concentration === c ? "selected" : ""} value="${c}">${c || "Onbekend"}</option>`).join("")}</select></label>
        </div>
        <label class="f" for="fTop">Topnoten<input class="inp" id="fTop" value="${join(v.top)}" placeholder="Bijv. bergamot, roze peper"><span class="hint">Scheid noten met komma's</span></label>
        <label class="f" for="fHeart">Hartnoten<input class="inp" id="fHeart" value="${join(v.heart)}" placeholder="Bijv. jasmijn, iris"></label>
        <label class="f" for="fBase">Basisnoten<input class="inp" id="fBase" value="${join(v.base)}" placeholder="Bijv. vanille, sandelhout"></label>
        <label class="f" for="fDesc">Beschrijving<textarea class="inp" id="fDesc" maxlength="1000">${esc(v.description)}</textarea></label>
        <div class="two">
          <label class="f" for="fDate">Getest op<input class="inp" type="date" id="fDate" value="${esc(v.testedOn || "")}" max="${today()}"><span class="ferr" id="eDate" hidden></span></label>
          <label class="f" for="fCode">Barcode<input class="inp" id="fCode" value="${esc(v.barcode || "")}" inputmode="numeric" maxlength="20"><span class="ferr" id="eCode" hidden></span></label>
        </div>
        <button class="btn primary block" type="submit">${ICON.check} ${ed ? "Wijzigingen bewaren" : t("save")}</button>
      </form>`,
      bind(m) {
        const fFile = $("#fFile", m);
        $("#fPhoto", m).onclick = () => fFile.click();
        $("#fPhotoDel", m) && ($("#fPhotoDel", m).onclick = () => { UI._formImage = null; $("#fImg", m).innerHTML = bottleSVG({ shape: "square", liquid: "#c9a45c" }); $("#fPhotoDel", m).remove(); });
        fFile.onchange = async () => { const f = fFile.files[0]; if (!f) return; try { const c = await Recognition.fileToCanvas(f, 1200); UI._formImage = Recognition.scaled(c, 360).dataUrl(); $("#fImg", m).innerHTML = `<img src="${UI._formImage}" alt="Foto">`; } catch (e) { UI.toast(e.message, true); } fFile.value = ""; };
        $("#pf", m).onsubmit = async (e) => {
          e.preventDefault();
          const val = (id) => $(id, m).value.trim(); let ok = true;
          const err = (fid, eid, msg) => { const i = $(fid, m), el = $(eid, m); i.classList.toggle("invalid", !!msg); el.hidden = !msg; el.textContent = msg || ""; if (msg && ok) i.focus(); if (msg) ok = false; };
          err("#fBrand", "#eBrand", val("#fBrand") ? "" : "Vul het merk in, bijvoorbeeld Chanel.");
          err("#fName", "#eName", val("#fName") ? "" : "Vul de naam van het parfum in.");
          err("#fDate", "#eDate", val("#fDate") && val("#fDate") > today() ? "De testdatum kan niet in de toekomst liggen." : "");
          err("#fCode", "#eCode", val("#fCode") && !/^\d{6,14}$/.test(val("#fCode")) ? "Een barcode bestaat uit 6 tot 14 cijfers." : "");
          if (!ok) return;
          const data = { brand: val("#fBrand"), name: val("#fName"), family: val("#fFam"), concentration: val("#fConc"), top: splitNotes(val("#fTop")), heart: splitNotes(val("#fHeart")), base: splitNotes(val("#fBase")), description: val("#fDesc"), testedOn: val("#fDate"), barcode: val("#fCode"), image: UI._formImage };
          try {
            const dest = after === "memory" ? "memory" : "perfume";
            if (ed) {
              const upd = async () => { try { await Library.update(ed.id, data); UI.toast("Wijzigingen bewaard"); UI.back(); } catch (er) { UI.toast(er.message || "Bewaren lukte niet.", true); } };
              const dup = norm(ed.brand + " " + ed.name) !== norm(data.brand + " " + data.name) && Library.findDuplicate(data.brand, data.name, ed.id);
              if (dup) confirmDuplicate(dup, upd); else await upd();
            } else {
              const create = async () => { try { const rec = await Library.save({ id: uid("m"), source: prefill.source || "manual", ...data, bottle: { shape: "square", liquid: famOf(data.family).color } }); UI.toast("Bewaard in je geurbibliotheek"); UI.stack.pop(); UI.go(dest, { id: rec.id }); } catch (er) { UI.toast(er.message || "Bewaren lukte niet. Probeer het opnieuw.", true); } };
              const dup = Library.findDuplicate(data.brand, data.name);
              if (dup) confirmDuplicate(dup, create, () => { UI.stack.pop(); UI.go(dest, { id: dup.id }); }); else await create();
            }
          } catch (er) { UI.toast(er.message || "Bewaren lukte niet. Probeer het opnieuw.", true); }
        };
      },
    };
  },

  profile() {
    const all = Library.all(), favs = all.filter((p) => p.favorite).length;
    const famCount = {}; all.forEach((p) => (famCount[p.family] = (famCount[p.family] || 0) + 1));
    const topFam = Object.entries(famCount).sort((a, b) => b[1] - a[1])[0];
    const status = [
      ["Navigatie, zoeken, filters en lijsten", "Werkt", "ok"],
      ["Opslag van je bibliotheek", "Werkt", "ok", Library.mode],
      ["Volledige back-up en terugzetten", "Werkt", "ok", "JSON-bestand met foto's en geurprofielen"],
      ["Barcode lezen uit cameraportret of foto", "Werkt", "ok", "Op je toestel, met BarcodeDetector of ZXing"],
      ["Opzoeken in productdatabase", "Demo", "warn", "Lokale demodatabase met " + CATALOG.length + " parfums"],
      STANDALONE ? ["Herkenning via tekst op het etiket", "Werkt", "ok", "Op je toestel (OCR), eerste keer internet nodig"] : ["Herkenning van de fles op beeld", "Werkt", "ok", "Via Claude, na toestemming"],
      ["Live camerabeeld in de app", "Beperkt", "warn", "De app gebruikt de fotocamera van je toestel"],
      ["Geurherkenning (Scannen → Geurherkenning)", "Demo", "sim", "Demomodus met gesimuleerde metingen; vergelijkingsscore, geen bewezen nauwkeurigheid"],
      ["Demo-geursensor", "Simulatie", "sim", "Gesimuleerde gegevens, geen meting"],
      ["Echte sensor (Scannen → Geurherkenning → Echte sensor)", "Voorbereid", "future", "Software klaar, nog niet met echte hardware getest. Vereist een externe geursensor en een protocolprofiel. Web Bluetooth: Chrome/Edge op Android en desktop; iPhone: toekomstige native app"],
      ["Virtuele testsensor", "Simulatie", "sim", "Gesimuleerde ruwe sensorstromen om verbinding, verwerking en herkenning te testen"],
      ["Signaalverwerking en meetkwaliteit", "Werkt", "ok", "Basislijn, filter, normalisatie, afwijkingen; getest met gesimuleerde stromen"],
      ["Herkenning met echte referentiemetingen", "Voorbereid", "future", "Uitlegbare vergelijkingsscore, geen bewezen nauwkeurigheid; toont Onbekende geur"],
      ["Geurprofielen beheren", "Werkt", "ok", "Bibliotheek → Geurgeheugen: toevoegen, bewerken, metingen, herkomst"],
      ["Geurprofiel naar geurmodule sturen", "Simulatie", "sim", "Pakket wordt opgebouwd, niet verzonden"],
      ["Geur echt laten ruiken", "Toekomst", "future", "Vereist ScentPhone-geurhardware"],
      ["Digitaal geurgeheugen: profielen bewaren en zoeken", "Werkt", "ok"],
      ["Geuren vergelijken", "Schatting", "warn", "Berekend uit opgegeven noten, geen gemeten overeenkomst"],
      ["Export en import van geurprofielen", "Werkt", "ok", "JSON-bestand met controle"],
      ["Partnerlinks naar webshops", "Werkt", "ok", "Eigen affiliatelinks via Profiel → Partnerlinks; zonder links geen koopknoppen"],
      ["Sensormetingen opslaan, vergelijken en exporteren", "Werkt", "ok", "Ruwe reeks, verwerkte gegevens en metadata apart; JSON en CSV"],
      ["Engelse taal", "In voorbereiding", "future"],
    ];
    return {
      title: "Mijn profiel",
      html: `
      <section class="row" style="gap:14px"><div class="iconbtn" style="width:62px;height:62px;font-family:var(--display);font-size:26px">${esc((Library.settings.name || "S").slice(0, 1).toUpperCase())}</div>
        <div style="min-width:0;flex:1"><div style="font-family:var(--display);font-size:24px">${esc(Library.settings.name || "Geurliefhebber")}</div><div class="small muted">${topFam ? "Vooral " + esc(famOf(topFam[0]).label.toLowerCase()) : "Nog geen voorkeur"}</div></div>
        <button class="btn sm ghost" id="editName">${ICON.pen} Naam</button></section>
      <div class="stats"><div class="stat"><b>${all.length}</b><small>Parfums</small></div><div class="stat"><b>${favs}</b><small>Favoriet</small></div><div class="stat"><b>${Library.lists.length}</b><small>Lijsten</small></div></div>
      <section class="section"><h2 class="sec">Instellingen</h2><div class="menu">
        <div>${ICON.globe.replace("<svg", '<svg width="20" height="20" style="color:var(--gold)"')}<div class="mi"><b>Taal</b><small>Engels volgt in een latere versie</small></div><select class="sel" id="lang" aria-label="Taal">${I18n.available.map((l) => `<option value="${l.id}" ${l.ready ? "" : "disabled"} ${I18n.locale === l.id ? "selected" : ""}>${l.label}${l.ready ? "" : " (binnenkort)"}</option>`).join("")}</select></div>
        <div>${ICON.db.replace("<svg", '<svg width="20" height="20" style="color:var(--gold)"')}<div class="mi"><b>Opslag</b><small>${esc(Library.mode)}</small></div></div>
        <button id="toLab">${ICON.chip.replace("<svg", '<svg width="20" height="20" style="color:var(--sim)"')}<div class="mi"><b>Geurtechnologie-lab</b><small>Demo-sensor, digitale profielen en geurmodule</small></div>${ICON.chev}</button>
        <button id="toShops">${ICON.bag.replace("<svg", '<svg width="20" height="20" style="color:var(--gold)"')}<div class="mi"><b>Partnerlinks</b><small>${cleanShops(Library.settings.shops).length ? cleanShops(Library.settings.shops).length + " ingesteld · koopknoppen bij parfums" : "Koopknoppen bij parfums instellen"}</small></div>${ICON.chev}</button>
      </div></section>
      <section class="section"><h2 class="sec">Gegevens overzetten</h2><p class="small muted">Maak een volledige back-up van je parfums, foto's, beoordelingen, lijsten en geurprofielen. Zet die terug in een andere versie van ScentPhone, bijvoorbeeld de zelfstandige app op je beginscherm. Gegevens gaan niet vanzelf mee naar een ander adres of toestel.</p>
        <div class="actions"><button class="btn" id="bkExp">${ICON.download} Back-up maken</button><button class="btn ghost" id="bkImp">${ICON.upload} Terugzetten</button></div></section>
      <section class="section"><h2 class="sec">Wat werkt in deze versie</h2><div class="status-list">${status.map(([n, s, k, d]) => `<div><span>${esc(n)}${d ? `<small>${esc(d)}</small>` : ""}</span><span class="pill ${k}">${esc(s)}</span></div>`).join("")}</div></section>
      <button class="btn danger block" id="wipe">${ICON.trash} Alle gegevens wissen</button>
      <p class="small muted" style="text-align:center">ScentPhone ${STANDALONE ? "0.5.1 · zelfstandige app" : "prototype 0.5.1"} · oktober 2026</p>`,
      bind(m) {
        $("#editName", m).onclick = () => UI.sheet(`<h3>Je naam</h3><form id="nf" class="form" novalidate><input class="inp" id="nIn" maxlength="40" value="${esc(Library.settings.name)}" placeholder="Voornaam" aria-label="Naam"><div class="actions"><button type="button" class="btn ghost" data-dismiss>Annuleren</button><button class="btn primary" type="submit">Bewaren</button></div></form>`,
          (s, close) => { $("#nf", s).onsubmit = async (e) => { e.preventDefault(); await Library.saveSettings({ name: $("#nIn", s).value.trim() }); close(); UI.render(); }; });
        $("#lang", m).onchange = (e) => { const l = I18n.available.find((x) => x.id === e.target.value); if (!l.ready) { UI.toast("Engels is nog in voorbereiding"); e.target.value = I18n.locale; return; } };
        $("#toLab", m).onclick = () => UI.go("lab");
        $("#toShops", m).onclick = () => shopsSheet(null);
        const be = $("#bkExp", m); if (be) be.onclick = () => exportBackup();
        const bi = $("#bkImp", m); if (bi) bi.onclick = () => restoreSheet();
        $("#wipe", m).onclick = () => UI.confirm("Alle gegevens wissen?", "Je bibliotheek, lijsten, beoordelingen en gesimuleerde profielen worden definitief verwijderd. Dit kan niet ongedaan worden gemaakt.", "Alles wissen", async () => { await Library.wipe(); UI.toast("Alle gegevens gewist"); UI.render(); });
      },
    };
  },

  /* ------------------- Geurgeheugen v1.0 ------------------- */
  memoryList() {
    const q = norm(UI.memQ || "");
    const all = Library.all();
    let items = all.map((p) => ({ p, ms: ScentMemory.measurements(p), tr: ScentMemory.traits(p) }));
    if (q) items = items.filter(({ p }) => norm([p.brand, p.name, ...(p.top || []), ...(p.heart || []), ...(p.base || [])].join(" ")).includes(q));
    items.sort((a, b) => ((b.ms[0] && b.ms[0].capturedAt) || "").localeCompare((a.ms[0] && a.ms[0].capturedAt) || "") || a.p.brand.localeCompare(b.p.brand, "nl"));
    const totalMs = all.reduce((s, p) => s + ScentMemory.measurements(p).length, 0);
    const simMs = all.reduce((s, p) => s + ScentMemory.measurements(p).filter((m) => m.source === "simulated").length, 0);
    const mf = UI.memFilter || "all";
    if (mf === "demo") items = items.filter(({ ms }) => ms.some((x) => x.source === "simulated"));
    else if (mf === "sensor") items = items.filter(({ ms }) => ms.some((x) => x.source === "sensor"));
    else if (mf === "none") items = items.filter(({ ms }) => !ms.length);
    return {
      title: "Geurgeheugen",
      headerRight: `<button class="iconbtn" id="addManual" aria-label="Nieuw geurprofiel">${ICON.plus}</button>`,
      html: `${libSeg()}
      <div class="notice gold">${ICON.db}<div>Elk bewaard parfum heeft hier een digitaal geurprofiel: naam, merk, geurfamilie, geurnoten, foto, een daaruit berekend kenmerkprofiel en de metingen. Demo-metingen zijn altijd als <b>simulatie</b> gelabeld; metingen van een echte sensor krijgen het label <b>Sensor</b>.</div></div>
      <button class="btn ghost block" id="memNew">${ICON.plus} Nieuw geurprofiel</button>
      <div class="actions"><button class="btn" id="goCmp" ${all.length > 1 ? "" : "disabled"}>${ICON.compare} Vergelijk geuren</button><button class="btn" id="goRec" ${all.length ? "" : "disabled"}>${ICON.target} Herkenning</button></div>
      <div class="search">${ICON.search}<input id="memQ" type="search" placeholder="Zoek op merk, naam of geurnoot" value="${esc(UI.memQ || "")}" aria-label="Zoeken in geurgeheugen"></div>
      <div class="chips" role="group" aria-label="Herkomst van metingen">${[["all", "Alle"], ["demo", "Demo-metingen"], ["sensor", "Echte sensor"], ["none", "Zonder metingen"]].map(([k, l]) => `<button class="chip" data-memf="${k}" aria-pressed="${mf === k}">${l}</button>`).join("")}</div>
      <div class="toolbar"><span class="small muted">${items.length} van ${all.length} profielen · ${totalMs} metingen (${simMs} gesimuleerd${totalMs - simMs ? ", " + (totalMs - simMs) + " sensor" : ""})</span></div>
      ${items.length ? `<div class="list">${items.map(({ p, ms, tr }) => `<button class="item" data-mem="${esc(p.id)}"><div class="thumb">${visual(p)}</div><div class="meta"><span class="brand">${esc(p.brand)}</span><span class="name">${esc(p.name)}</span><span class="sub">${esc(famOf(p.family).label)} · ${ms.length ? ms.length + (ms.length === 1 ? " meting" : " metingen") + " · " + esc(fmtDate(ms[0].capturedAt.slice(0, 10))) : "nog geen metingen"}${tr ? "" : " · noten onvolledig"}</span></div><div class="end">${ms.length ? `<span class="pill ${ms[0].source === "sensor" ? "ok" : "sim"}">${ms[0].source === "sensor" ? "Sensor" : "Sim"}</span>` : ""}</div></button>`).join("")}</div>`
        : all.length ? `<div class="empty">${ICON.search}<b>Geen profielen gevonden</b><p class="muted small">Zoek op een ander merk, een andere naam of geurnoot, of kies een ander filter.</p></div>` : `<div class="empty">${ICON.db}<b>Nog geen geurprofielen</b><p class="muted small">Bewaar een parfum; het krijgt automatisch een digitaal geurprofiel.</p></div>`}
      <section class="section"><h2 class="sec">Back-up</h2><p class="small muted">Exporteer geurprofielen en metingen als JSON-bestand, of importeer een eerdere export. Importeren voegt alleen toe en overschrijft nooit bestaande parfums.</p>
        <div class="actions"><button class="btn ghost" id="expBtn" ${all.length ? "" : "disabled"}>${ICON.download} Exporteren</button><button class="btn ghost" id="impBtn">${ICON.upload} Importeren</button></div></section>`,
      bind(m, tb) {
        const inp = $("#memQ", m);
        inp.oninput = debounce(() => { UI.memQ = inp.value; const pos = inp.selectionStart; UI.render(); const n = $("#memQ"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
        const c = $("#goCmp", m); if (c) c.onclick = () => UI.go("compare", {});
        const r = $("#goRec", m); if (r) r.onclick = () => UI.go("recognize", {});
        const ex = $("#expBtn", m); if (ex) ex.onclick = () => exportProfiles();
        const im = $("#impBtn", m); if (im) im.onclick = () => importSheet();
        $$("[data-memf]", m).forEach((b) => (b.onclick = () => { UI.memFilter = b.dataset.memf; UI.render(); }));
        $("#memNew", m).onclick = () => UI.go("form", { after: "memory" });
        const add = $("#addManual", tb); if (add) add.onclick = () => UI.go("form", { after: "memory" });
      },
    };
  },

  memory({ id }) {
    const p = Library.get(id);
    if (!p) return { title: "Geurgeheugen", html: `<div class="empty">${ICON.alert}<b>Dit geurprofiel bestaat niet meer</b><p class="muted small">Het parfum is mogelijk verwijderd.</p></div>` };
    const tr = ScentMemory.traits(p), ms = ScentMemory.measurements(p), fam = famOf(p.family);
    const notesRow = (lab, arr) => `<div class="kv"><span>${lab}</span><span>${arr && arr.length ? arr.map(esc).join(", ") : '<span class="muted">—</span>'}</span></div>`;
    return {
      title: p.name,
      html: `
      <div class="row" style="gap:14px"><div class="thumb" style="width:72px;height:90px;flex:none">${visual(p)}</div><div style="min-width:0"><div class="eyebrow">${esc(p.brand)}</div><div style="font-family:var(--display);font-size:26px;line-height:1.1;overflow-wrap:anywhere">${esc(p.name)}</div><div class="row wrap" style="gap:8px;margin-top:8px"><button class="btn sm ghost" data-open="${esc(p.id)}">Parfumprofiel</button><button class="btn sm ghost" id="mEdit">${ICON.pen} Bewerken</button></div></div></div>
      <section class="section"><div class="row between"><h2 class="sec">Opgegeven geurgegevens</h2><span class="pill">${esc(SOURCE_LABEL[p.source] || "Eigen invoer")}</span></div>
        <div class="kvs">${notesRow("Geurfamilie", p.family ? [fam.label] : [])}${notesRow(t("top"), p.top)}${notesRow(t("heart"), p.heart)}${notesRow(t("base"), p.base)}${notesRow("Foto", p.image ? ["Eigen foto"] : [])}<div class="kv"><span>Metingen</span><span>${ms.length ? `${ms.filter((x) => x.source === "simulated").length} demo (simulatie) · ${ms.filter((x) => x.source === "sensor").length} echte sensor<br><span class="muted small">Laatste meting ${esc(new Date(ms[0].capturedAt).toLocaleString("nl-NL", { dateStyle: "medium", timeStyle: "short" }))}</span>` : '<span class="muted">Nog geen metingen</span>'}</span></div></div>
        <p class="hint">Deze gegevens komen uit ${p.source === "catalog" ? "de demo-catalogus" : p.source === "ai" ? "beeldherkenning" : p.source === "import" ? "een importbestand" : "je eigen invoer"} en worden door metingen nooit aangepast.</p></section>
      <section class="section"><div class="row between"><h2 class="sec">Kenmerkprofiel</h2><span class="pill">Berekend</span></div>
        ${tr ? `<div class="radar-wrap gold">${radarSVG(tr, { tone: "gold", label: "Kenmerkprofiel" })}<span class="pill wm">Geen meting</span></div>
          <p class="small muted">Berekend met een vaste regel: elke herkende noot telt mee voor een geurrichting, aangevuld met de geurfamilie. ${tr.unmatched.length ? "Niet herkend en dus niet meegeteld: " + tr.unmatched.map(esc).join(", ") + "." : "Alle noten zijn herkend."}</p>`
          : `<div class="notice gold">${ICON.info}<div>Te weinig herkenbare geurnoten om een kenmerkprofiel te berekenen. Vul de noten en geurfamilie aan in het parfumprofiel.</div></div>`}</section>
      <section class="section"><div class="row between"><h2 class="sec">Metingen</h2><span class="pill sim">${ms.length}</span></div>
        ${ms.length ? sensorRepeatHTML(ms) : ""}${ms.length ? `<div class="meas">${ms.map((x, i) => `<details ${i === 0 ? "open" : ""}><summary><span class="pill ${x.source === "sensor" ? "ok" : "sim"}">${x.source === "sensor" ? "Sensor" : "Simulatie"}</span><span class="mmeta">${esc(new Date(x.capturedAt).toLocaleString("nl-NL", { dateStyle: "medium", timeStyle: "short" }))}<small>${esc(x.device.name)}${x.imported ? " · geïmporteerd" : ""}${x.legacy ? " · formaat v0.1" : ""}</small></span></summary>
            ${x.sensor ? "" : ScentRecognitionEngine.calibrated(x) ? `<div class="radar-wrap ${x.source === "sensor" ? "gold" : ""}">${radarSVG(x, { tone: x.source === "sensor" ? "gold" : "sim", label: "Meting" })}<span class="pill ${x.source === "sensor" ? "ok" : "sim"} wm">${x.source === "sensor" ? "Sensormeting" : "Gesimuleerd"}</span></div>` : `${channelBarsHTML(x)}<p class="small muted">Ongekalibreerde sensormeting: ruwe respons per kanaal, nog niet omgezet in geurrichtingen.</p>`}
            ${x.sensor ? sensorMeasHTML(p, x) : `<p class="small muted">${x.source === "simulated" ? "Gesimuleerd: afgeleid van het kenmerkprofiel" + (x.simulation && x.simulation.variation ? " met vaste variatie van ±" + Math.round(x.simulation.variation * 100) + "%" : "") + ". Geen echte meting." : x.imported ? "Gemarkeerd als sensormeting in het importbestand; niet door deze app gemeten." : "Sensormeting."}</p>`}
            <div class="kvs"><div class="kv"><span>Herkomst</span><span>${x.source === "sensor" ? "Echte sensor" : "Demomodus (simulatie)"}</span></div><div class="kv"><span>Apparaat</span><span>${esc(x.device.name)}${x.device.model ? " · " + esc(x.device.model) : ""}${x.device.firmware ? ` <span class="muted small">(${esc(x.device.firmware)})</span>` : ""}</span></div>${x.conditions ? `<div class="kv"><span>Omgeving</span><span>${x.conditions.tempC !== null ? esc(x.conditions.tempC) + " °C" : ""}${x.conditions.tempC !== null && x.conditions.humidity !== null ? " · " : ""}${x.conditions.humidity !== null ? esc(x.conditions.humidity) + "% luchtvochtigheid" : ""}</span></div>` : ""}${x.recognition && x.recognition.top.length ? `<div class="kv"><span>Herkenning</span><span>${x.recognition.top.slice(0, 3).map((y) => esc(y.brand + " " + y.name) + ` <span class="muted small">(${y.score})</span>`).join("<br>")}</span></div>` : ""}</div>
            <details style="border:0;padding:0;background:none"><summary class="small" style="min-height:32px;color:var(--gold)">Meetgegevens (${x.channels.length} kanalen${x.source === "simulated" ? ", gesimuleerd" : ""})</summary>${channelTableHTML(x)}</details>
            <button class="btn sm danger" data-delm="${esc(x.id)}">${ICON.trash} Meting verwijderen</button></details>`).join("")}</div>`
          : `<p class="small muted">Nog geen metingen. Een echte meting vereist een externe geursensor (Scannen → Geurherkenning → Echte sensor); maak nu een gesimuleerde meting om de werking te zien.</p>`}
        <div class="actions"><button class="btn" id="mSim" ${tr ? "" : "disabled"}>${ICON.chip} Simuleer meting</button><button class="btn ghost" id="mRec" ${tr ? "" : "disabled"}>${ICON.target} Herkenning</button></div>
        <button class="btn ghost block" id="mCmp" ${Library.items.size > 1 ? "" : "disabled"}>${ICON.compare} Vergelijk met ander parfum</button>
      </section>
      <button class="btn danger block" id="mDel">${ICON.trash} Geurprofiel en parfum verwijderen</button>`,
      bind(m) {
        const sim = $("#mSim", m);
        if (sim) sim.onclick = async () => {
          sim.disabled = true; sim.innerHTML = '<span class="spinner"></span> Simuleren…';
          try { const s = ScentHardware.sensors()[0]; if (!s.isConnected()) await s.connect(); const prof = await s.measure({ perfume: Library.get(id) }); await ScentMemory.addMeasurement(id, prof); UI.toast("Gesimuleerde meting bewaard"); UI.render(); }
          catch (e) { UI.toast(e.message || "Simulatie mislukt", true); sim.disabled = false; sim.innerHTML = ICON.chip + " Simuleer meting"; }
        };
        const rec = $("#mRec", m); if (rec) rec.onclick = () => UI.go("recognize", { id });
        const cmp = $("#mCmp", m); if (cmp) cmp.onclick = () => UI.go("compare", { a: id });
        $("#mEdit", m).onclick = () => UI.go("form", { editId: id });
        $("#mDel", m).onclick = () => UI.confirm("Geurprofiel verwijderen?", `${p.brand} ${p.name} wordt met alle metingen, je beoordeling en opmerkingen uit je bibliotheek verwijderd. Maak eventueel eerst een back-up.`, "Verwijderen", async () => { await Library.remove(id); UI.toast("Verwijderd"); UI.back(); });
        $$("[data-mexp]", m).forEach((b) => (b.onclick = (e) => { e.preventDefault(); const x = ScentMemory.measurements(Library.get(id)).find((y) => y.id === b.dataset.mexp); if (x) measurementExportSheet(x, x.rawRef ? Library.getRaw(x.rawRef) : null, Library.get(id)); }));
        $$("[data-mcmp]", m).forEach((b) => (b.onclick = (e) => { e.preventDefault(); const x = ScentMemory.measurements(Library.get(id)).find((y) => y.id === b.dataset.mcmp); if (x && Kit) measurementCompareSheet(Library.get(id), x); }));
        $$("[data-delm]", m).forEach((b) => (b.onclick = (e) => { e.preventDefault(); UI.confirm("Meting verwijderen?", "Alleen deze meting wordt verwijderd. Het parfum en je andere gegevens blijven bewaard.", "Verwijderen", async () => { await ScentMemory.removeMeasurement(id, b.dataset.delm); UI.toast("Meting verwijderd"); UI.render(); }); }));
      },
    };
  },

  compare(params) {
    const all = Library.all().sort((a, b) => a.brand.localeCompare(b.brand, "nl"));
    const st = UI.cmp || (UI.cmp = {});
    if (params.a && st.from !== params.a) { st.a = params.a; st.from = params.a; if (st.b === params.a) st.b = ""; }
    if (st.a && !Library.has(st.a)) st.a = ""; if (st.b && !Library.has(st.b)) st.b = "";
    const a = st.a && Library.get(st.a), b = st.b && Library.get(st.b);
    const opt = (sel, other) => `<option value="">Kies parfum…</option>${all.map((p) => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""} ${p.id === other ? "disabled" : ""}>${esc(p.brand)} — ${esc(p.name)}</option>`).join("")}`;
    const res = a && b ? ScentMemory.compare(a, b) : null;
    const col = (p) => `<div class="cmp-col"><div class="thumb">${visual(p)}</div><span class="brand">${esc(p.brand)}</span><b>${esc(p.name)}</b><span class="fam sm"><i style="background:${famOf(p.family).color}"></i>${esc(famOf(p.family).label)}</span>
      ${[["top", p.top], ["heart", p.heart], ["base", p.base]].map(([k, arr]) => `<div class="cmp-notes"><small>${t(k)}</small>${arr && arr.length ? arr.map((n) => `<span class="note ${res && res.shared.some((s) => ScentMemory._same(norm(s), norm(n))) ? "shared" : ""}">${esc(n)}</span>`).join("") : '<span class="muted small">—</span>'}</div>`).join("")}</div>`;
    return {
      title: "Vergelijk geuren",
      html: `
      <div class="two"><label class="f" for="cmpA">Parfum 1<select class="inp" id="cmpA">${opt(st.a, st.b)}</select></label><label class="f" for="cmpB">Parfum 2<select class="inp" id="cmpB">${opt(st.b, st.a)}</select></label></div>
      ${all.length < 2 ? `<div class="empty">${ICON.compare}<b>Bewaar minstens twee parfums</b><p class="muted small">Vergelijken werkt met parfums uit je bibliotheek.</p></div>` : !res ? `<p class="small muted">Kies twee verschillende parfums uit je bibliotheek.</p>` : `
      <section class="score-card">
        ${res.score !== null ? `<div class="score"><b>${res.score}<small>%</small></b><span>geschatte overeenkomst</span></div>` : `<div class="score"><b>—</b><span>geen schatting mogelijk</span></div>`}
        <div class="notice" style="margin-top:4px">${ICON.info}<div><b>Softwarematige schatting, geen gemeten geurovereenkomst.</b> Berekend uit de opgegeven geurnoten en geurfamilie. Hoe twee geuren echt op elkaar lijken, kan pas met sensormetingen worden bepaald.</div></div>
        ${res.reason ? `<p class="small" style="color:var(--warn)">${esc(res.reason)}</p>` : ""}
        <div class="bars">${res.parts.map((x) => `<div class="bar"><div class="row between"><span>${esc(x.label)}</span><span class="num">${Math.round(x.value * 100)}% · weegt ${Math.round(x.weight * 100)}%</span></div><div class="track"><i style="width:${Math.round(x.value * 100)}%"></i></div></div>`).join("")}</div>
        ${res.shared.length ? `<p class="small muted">Gedeelde noten: ${res.shared.map(esc).join(", ")}</p>` : `<p class="small muted">Geen gedeelde geurnoten gevonden.</p>`}
      </section>
      <div class="cmp">${col(a)}${col(b)}</div>
      ${res.ta && res.tb ? `<section class="section"><h2 class="sec">Kenmerkprofielen</h2><div class="radar-wrap gold">${radarSVG(res.ta, { tone: "gold", compare: res.tb, label: "Kenmerkprofielen naast elkaar" })}<span class="pill wm">Berekend</span></div>
        <div class="legend"><span><i class="lg gold"></i>${esc(a.brand)} ${esc(a.name)}</span><span><i class="lg ivory"></i>${esc(b.brand)} ${esc(b.name)}</span></div></section>` : ""}`}`,
      bind(m) {
        const sa = $("#cmpA", m), sb = $("#cmpB", m);
        if (sa) sa.onchange = () => { st.a = sa.value; UI.render(); };
        if (sb) sb.onchange = () => { st.b = sb.value; UI.render(); };
      },
    };
  },

  /* ------------------- Geurherkenning 1.0 (Scannen → Geurherkenning) ------------------- */
  scent(params = {}) {
    const st = UI.scent, embedded = !!params.embedded;
    if (params.id && st.from !== params.id) { st.from = params.id; st.sample = params.id; st.mode = "demo"; st.result = null; st.error = ""; }
    if (st.mode === "real") return realSensorScreen(params); /* 0.5: Scannen → Geurherkenning → Echte sensor */
    const real = ScentHardware.realSensor();
    const pool = scentPool();
    if (!st.sample || !pool.some((p) => p.id === st.sample)) st.sample = pool[0] && pool[0].id;
    const isDemo = st.mode !== "real", r = st.result;
    const canStart = !st.running && (isDemo ? pool.length > 0 : real.isConnected());
    const stageState = st.running ? "run" : r ? "done" : "idle";
    const C = 2 * Math.PI * 112;
    const motes = Array.from({ length: 9 }, (_, i) => `<i class="mote" style="left:${18 + ((i * 37) % 64)}%;--dx:${((i % 3) - 1) * 18}px;animation-delay:${(i * 0.53).toFixed(2)}s"></i>`).join("");
    const sampleName = (id) => { const p = Library.get(id); return p ? p.brand + " — " + p.name : "—"; };
    const capText = st.running ? (isDemo ? (st.blindId ? "Verborgen demomonster wordt gesimuleerd" : "Demo: " + sampleName(st.runSample)) : "Echte sensor meet…")
      : r ? (r.measurement.source === "sensor" ? "Meting van je sensor voltooid" : "Gesimuleerde meting voltooid")
      : isDemo ? (pool.length ? "Kies een monster en start de demonstratie" : "Bewaar eerst parfums met geurnoten") : real.isConnected() ? "Klaar om te meten" : "Verbind eerst een echte sensor";
    const stage = `<div class="nose-stage ${stageState}" id="snStage" aria-hidden="true">
        <div class="cap-tl">${isDemo ? `<span class="pill sim">Simulatie</span>` : real.isConnected() ? `<span class="pill ok">Echte sensor</span>` : `<span class="pill future">Geen sensor</span>`}</div>
        ${motes}
        <div class="orb"><div class="sweep"></div>
          <svg viewBox="0 0 240 240"><defs><linearGradient id="snG" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ead39b"/><stop offset=".6" stop-color="#c9a45c"/><stop offset="1" stop-color="#8c6d33"/></linearGradient></defs>
            <circle cx="120" cy="120" r="112" fill="none" stroke="rgba(201,164,92,.14)" stroke-width="2"/>
            <circle id="snRing" class="prog" cx="120" cy="120" r="112" fill="none" stroke="url(#snG)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - (r ? 1 : st.pct / 100))).toFixed(1)}" transform="rotate(-90 120 120)"/>
            <g class="r1"><circle cx="120" cy="120" r="96" fill="none" stroke="rgba(234,211,155,.5)" stroke-width="1" stroke-dasharray="2 9"/><circle cx="120" cy="24" r="3" fill="#ead39b"/></g>
            <g class="r2"><circle cx="120" cy="120" r="80" fill="none" stroke="rgba(201,164,92,.35)" stroke-width="1" stroke-dasharray="38 14"/><circle cx="200" cy="120" r="2.2" fill="#c9a45c"/></g>
          </svg>
          <div class="core">${st.running ? `<span class="pct" id="snPct">${Math.round(st.pct)}%</span>` : r ? ICON.check : ICON.aroma}</div>
        </div>
        <div class="cap-b" id="snCap">${esc(capText)}</div></div>`;
    const steps = st.running || st.steps.length ? `<div class="progress" id="snProg"><div class="row between"><span class="small muted">Voortgang${isDemo ? " (simulatie)" : ""}</span><span class="small" id="snPctTxt" style="color:var(--gold-hi);font-variant-numeric:tabular-nums">${Math.round(r ? 100 : st.pct)}%</span></div><div class="track"><i id="snBar" style="width:${Math.round(r ? 100 : st.pct)}%"></i></div><div class="steps" id="snSteps">${scentStepsHTML()}</div></div>` : "";
    const controls = isDemo
      ? (pool.length ? `<section class="section"><label class="f" for="snSample">Demomonster (bestaand parfum)<select class="inp" id="snSample" ${st.running || st.blind ? "disabled" : ""}>${pool.map((p) => `<option value="${esc(p.id)}" ${p.id === st.sample ? "selected" : ""}>${esc(p.brand)} — ${esc(p.name)}</option>`).join("")}</select></label>

/* ---------------------------- Partnerlinks (0.5.1) ----------------
 * Koopknoppen ("Koop bij…", "Sample bij…") met de eigen affiliatelinks van de gebruiker.
 * Opslag: Library.settings.shops = [{ id, name, kind: "buy"|"sample", url, on }]. Alleen https-links.
 * {zoek} in de link wordt vervangen door merk + naam van het parfum (URL-gecodeerd).
 * Zonder ingestelde links toont de app geen koopknoppen. Er worden geen prijzen verzonnen.
 */
const SHOPS_MAX = 6;
function shopUrlOk(u) { if (!/^https:\/\/\S+$/i.test(u || "")) return false; try { new URL(String(u).replace(/\{zoek\}/g, "test")); return true; } catch (e) { return false; } }
function cleanShops(list) {
  return (Array.isArray(list) ? list : []).slice(0, SHOPS_MAX).map((x) => ({ id: String((x && x.id) || uid("sh")).slice(0, 40), name: String((x && x.name) || "").trim().slice(0, 40), kind: x && x.kind === "sample" ? "sample" : "buy", url: String((x && x.url) || "").trim().slice(0, 1000), on: !(x && x.on === false) }))
    .filter((x) => x.name && shopUrlOk(x.url));
}
/** Staat {zoek} binnen een al gecodeerd winkeladres (bijv. ...&ued=https%3A%2F%2F...%3Fq%3D{zoek}), dan wordt de zoekterm dubbel gecodeerd. */
function shopLink(s, p) {
  const q = encodeURIComponent(((p.brand || "") + " " + (p.name || "")).trim());
  return s.url.replace(/\{zoek\}/g, (m, i, all) => (/%3[fFdD]|%26/.test(all.slice(0, i)) ? encodeURIComponent(q) : q));
}
function shopsHTML(p) {
  const shops = cleanShops(Library.settings.shops).filter((s) => s.on); if (!shops.length) return "";
  return `<section class="section"><h2 class="sec">Kopen of proberen</h2>
    <div class="actions fit">${shops.map((s, i) => `<a class="btn ${i === 0 ? "primary" : ""}" href="${esc(shopLink(s, p))}" target="_blank" rel="sponsored noopener">${s.kind === "sample" ? ICON.aroma : ICON.bag} ${s.kind === "sample" ? "Sample bij " : "Koop bij "}${esc(s.name)}</a>`).join("")}</div>
    <p class="hint">Bevat partnerlinks: ScentPhone kan een vergoeding ontvangen als je via deze knoppen iets koopt. Je betaalt de normale prijs van de winkel.</p></section>`;
}
function shopsSheet(editId) {
  const shops = cleanShops(Library.settings.shops), cur = shops.find((s) => s.id === editId) || null;
  const ex = Library.all()[0] || CATALOG[0];
  UI.sheet(`<h3>Partnerlinks</h3>
    <p class="small muted">Voeg de affiliatelinks toe die je van je partnernetwerk krijgt (bijvoorbeeld Daisycon of Awin). Zet <code>{zoek}</code> op de plek van de zoekterm; ScentPhone vult daar merk en naam van het parfum in. Zonder <code>{zoek}</code> gaat de knop altijd naar dezelfde pagina.</p>
    ${shops.length ? `<div class="list">${shops.map((s) => `<div class="device"><span class="led ${s.on ? "ok" : ""}"></span><div class="meta"><b>${esc(s.name)}</b><small>${s.kind === "sample" ? "Sample" : "Kopen"}${s.on ? "" : " · verborgen"} · ${esc(s.url.replace(/^https:\/\//i, "").slice(0, 34))}…</small></div><button class="btn sm ghost" data-she="${esc(s.id)}">Bewerk</button></div>`).join("")}</div>`
      : `<p class="small muted">Nog geen partnerlinks. Zolang er geen links zijn, toont de app geen koopknoppen.</p>`}
    <form id="shf" class="form" novalidate><h3 style="margin-top:6px">${cur ? "Bewerk " + esc(cur.name) : "Nieuwe partnerlink"}</h3>
      <label class="f">Naam winkel<input class="inp" name="name" maxlength="40" value="${esc(cur ? cur.name : "")}" placeholder="Parfumwinkel"></label>
      <label class="f">Soort knop<select class="inp" name="kind"><option value="buy">Kopen</option><option value="sample" ${cur && cur.kind === "sample" ? "selected" : ""}>Sample proberen</option></select></label>
      <label class="f">Partnerlink<input class="inp mono" name="url" value="${esc(cur ? cur.url : "")}" placeholder="https://…{zoek}…" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"><span class="hint" id="shPrev"></span></label>
      <label class="chk"><input type="checkbox" name="on" ${!cur || cur.on ? "checked" : ""}><span><b>Tonen bij parfums</b><small>Uitzetten verbergt de knop zonder de link te verwijderen.</small></span></label>
      <div class="notice err" id="shErr" hidden></div>
      <div class="actions fit">${cur ? `<button type="button" class="btn danger" id="shDel">${ICON.trash} Verwijderen</button>` : `<button type="button" class="btn ghost" data-dismiss>Sluiten</button>`}<button class="btn primary" type="submit">Bewaren</button></div>
      ${cur ? `<div class="actions fit"><button type="button" class="btn sm ghost" id="shTest">${ICON.search} Test met ${esc(ex.brand)} ${esc(ex.name)}</button><button type="button" class="btn sm ghost" id="shNew">${ICON.plus} Nieuwe link</button></div>` : ""}
    </form>`, (sh, close) => {
    const f = $("#shf", sh), err = $("#shErr", sh), prev = $("#shPrev", sh);
    const showErr = (m) => { err.hidden = !m; err.innerHTML = m ? `${ICON.alert}<div>${esc(m)}</div>` : ""; };
    const upd = () => { const u = f.elements.url.value.trim(); prev.textContent = !u ? "Begint met https://" : shopUrlOk(u) ? (u.includes("{zoek}") ? "Voorbeeld: " + shopLink({ url: u }, ex).slice(0, 90) : "Zonder {zoek}: de knop opent altijd deze pagina.") : "Dit is geen geldige https-link."; };
    f.elements.url.oninput = upd; upd();
    $$("[data-she]", sh).forEach((b) => (b.onclick = () => { close(); shopsSheet(b.dataset.she); }));
    f.onsubmit = async (e) => {
      e.preventDefault();
      const name = f.elements.name.value.trim(), url = f.elements.url.value.trim();
      if (!name) return showErr("Vul de naam van de winkel in.");
      if (!shopUrlOk(url)) return showErr("Vul een geldige link in die begint met https://.");
      if (!cur && shops.length >= SHOPS_MAX) return showErr("Je kunt maximaal " + SHOPS_MAX + " partnerlinks instellen.");
      const item = { id: cur ? cur.id : uid("sh"), name, kind: f.elements.kind.value === "sample" ? "sample" : "buy", url, on: f.elements.on.checked };
      const list = cur ? shops.map((s) => (s.id === cur.id ? item : s)) : [...shops, item];
      try { await Library.saveSettings({ shops: list }); } catch (er) { return showErr(er.message || "Bewaren lukte niet."); }
      close(); UI.toast("Partnerlink bewaard"); UI.render();
    };
    const del = $("#shDel", sh); if (del) del.onclick = async () => { await Library.saveSettings({ shops: shops.filter((s) => s.id !== cur.id) }); close(); UI.toast("Partnerlink verwijderd"); UI.render(); };
    const tst = $("#shTest", sh); if (tst) tst.onclick = () => { const w = window.open(shopLink(cur, ex), "_blank", "noopener"); if (!w) UI.toast("Kon de link niet openen.", true); };
    const nw = $("#shNew", sh); if (nw) nw.onclick = () => { close(); shopsSheet(null); };
  });
}

    <div id="rsMsg" hidden></div>
    <div class="actions"><button class="btn ghost" data-dismiss>Annuleren</button><button class="btn primary" id="rsGo" disabled>Terugzetten</button></div>`,
    (sh, close) => {
      const msg = $("#rsMsg", sh), go = $("#rsGo", sh), f = $("#rsFile", sh); let parsed = null;
      const show = (html, err) => { msg.hidden = false; msg.innerHTML = `<div class="notice ${err ? "err" : "gold"}">${err ? ICON.alert : ICON.info}<div>${html}</div></div>`; };

async function runScentRecognition() {
  const st = UI.scent; if (st.running) return;
  if (st.mode === "real") return runRealMeasurement(); /* echte sensor: eigen meetprocedure */
  const isDemo = st.mode !== "real";
  const sensor = isDemo ? ScentHardware.demoSensor() : ScentHardware.realSensor();
  let perfume = null;
  if (isDemo) {
    const pool = scentPool(); if (!pool.length) { UI.toast("Bewaar eerst parfums met geurnoten.", true); return; }
    if (st.blind && pool.length > 1) { perfume = pool[Math.floor(Math.random() * pool.length)]; st.blindId = perfume.id; }
    else { perfume = Library.get(st.sample) || pool[0]; st.blindId = null; }
    st.runSample = perfume.id;
  } else if (!sensor.isConnected()) { UI.toast("Verbind eerst een echte sensor die meetgegevens stuurt.", true); return; }
  Object.assign(st, { running: true, result: null, error: "", pct: 0, steps: [], ctrl: new AbortController() });
  const signal = st.ctrl.signal;
  const step = (label, pct) => {
    const s = st.steps, last = s[s.length - 1];
    if (!last || last.t !== label) { if (last && last.s === "run") last.s = "done"; s.push({ t: label, s: "run" }); }
    st.pct = Math.max(st.pct, Math.min(99, pct)); paintScentProgress();
  };

  try {
    if (isDemo && !sensor.isConnected()) { step("Demo-sensor verbinden (virtueel)", 4); await sensor.connect(); }
    st.run = (st.run || 0) + 1;
    const m = await sensor.measure({ perfume, run: st.run, signal, onProgress: (ph) => step(ph.label, ph.pct) });
    step("Vergelijken met je geurprofielen", 92); await sleep(isDemo ? 650 : 200, signal);
    const rec = ScentRecognitionEngine.recognize(m, { limit: 5 });
    st.steps.forEach((x) => { if (x.s === "run") x.s = "done"; }); st.pct = 100;
    st.result = { measurement: m, rec, sampleId: perfume ? perfume.id : null, blind: !!st.blindId, saveTarget: isDemo ? perfume.id : ((rec.matches[0] && rec.matches[0].perfume.id) || ""), saved: false };
  } catch (e) {
    st.steps.forEach((x) => { if (x.s === "run") x.s = "fail"; });
    st.error = e && e.name === "AbortError" ? "Je hebt de meting gestopt. Er is niets bewaard." : (e && e.message) || "De meting lukte niet. Er is niets bewaard.";
  } finally {
    st.running = false; st.ctrl = null;
    if (scentVisible()) { UI.render(); const el = document.getElementById(st.result ? "snResult" : "snProg"); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }
}

      const stop = $("#rsStop", m); if (stop) stop.onclick = () => { if (rs.ctrl) rs.ctrl.abort(); };
      const sv = $("#rsSave", m); if (sv) sv.onclick = () => { const t = $("#rsTarget", m); saveRealMeasurement(t ? t.value : ""); };
      const pf = $("#rsProfile", m); if (pf) pf.onclick = () => UI.go("memory", { id: pf.dataset.id });
      const ex = $("#rsExport", m); if (ex) ex.onclick = () => measurementExportSheet(rs.result.measurement, rs.result.raw, null);
      const thb = $("#rsTh", m); if (thb) thb.onclick = () => thresholdSheet();

        const res = await saveFile("scentphone-trainingset-" + today() + ".json", JSON.stringify(set, null, 2), "Trainingsset");
        if (res !== "cancel" && res !== "copy") UI.toast(set.samples.length + " metingen geëxporteerd");

}
async function rsConnect(dev) {
  const s = SensorHub.session;
  try {
    const p = s.connect(dev); UI.render();
    const ok = await p;
    if (ok) UI.toast(s.simulated ? "Virtuele testsensor verbonden (simulatie)" : "Sensor verbonden: geldige meetgegevens ontvangen");
  } catch (e) { UI.toast(e.message || "Verbinden lukte niet.", true); }
  if (realVisible() && !UI.rs.running) UI.render();
}
async function runRealMeasurement() {
  const rs = UI.rs, s = SensorHub.session; if (rs.running) return;
  if (!s || !s.isLive()) { UI.toast("Verbind eerst een sensor die geldige meetgegevens stuurt.", true); return; }
  Object.assign(rs, { running: true, result: null, error: "", pct: 0, steps: [], phase: "", remaining: 0, ctrl: new AbortController() });
  const step = (label, pct) => { const l = rs.steps[rs.steps.length - 1]; if (!l || l.t !== label) { if (l && l.s === "run") l.s = "done"; rs.steps.push({ t: label, s: "run" }); } rs.pct = Math.max(rs.pct, Math.min(99, pct)); };
  if (realVisible()) { UI.render(); const el = document.getElementById("rsRun"); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  try {
    const sig = Kit.signatureOf(s.profile, s.last ? s.last.values.length : 0, s.device && s.device.model, s.simulated);
    const { measurement, raw } = await Kit.runMeasurement(s, { signal: rs.ctrl.signal, calibration: SensorHub.calibrationFor(sig), onProgress: (x) => { step(x.label, x.pct); rs.phase = x.phase; rs.remaining = x.remainingS; paintRealProgress(); } });
    step("Vergelijken met je referentiemetingen", 96);
    const rec = Kit.Recognizer.recognize(measurement, SensorHub.library(), { thresholds: SensorHub.thresholds() });
    rs.steps.forEach((x) => { if (x.s === "run") x.s = measurement.quality.accepted ? "done" : "fail"; }); rs.pct = 100;
    rs.result = { measurement, raw, rec, saved: "", saveTarget: rec.status === "match" ? rec.matches[0].perfume.id : "" };
  } catch (e) {
    rs.steps.forEach((x) => { if (x.s === "run") x.s = "fail"; });
    rs.error = e && e.name === "AbortError" ? "Je hebt de meting gestopt. Er is niets bewaard." : (e && e.message) || "De meting lukte niet. Er is niets bewaard.";
  } finally {
    rs.running = false; rs.ctrl = null; rs.phase = "";
    if (realVisible()) { UI.render(); const el = document.getElementById(rs.result ? "rsResult" : "rsRun"); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }
}
async function saveRealMeasurement(targetId) {
  const r = UI.rs.result; if (!r || r.saved) return;
  if (!r.measurement.quality.accepted) { UI.toast("Metingen met onvoldoende kwaliteit worden niet bewaard.", true); return; }
  if (!targetId || !Library.has(targetId)) { UI.toast("Kies het parfum dat je hebt gemeten.", true); return; }
  const m = { ...r.measurement, recognition: { engine: r.rec.engine, method: r.rec.method.slice(0, 150), at: new Date().toISOString(), top: r.rec.matches.slice(0, 5).map((x) => ({ perfumeId: x.perfume.id, brand: x.perfume.brand, name: x.perfume.name, score: x.score })) } };
  try { await ScentMemory.addMeasurement(targetId, m); }
  catch (e) { UI.toast(e.message || "Bewaren lukte niet. Er is niets gewijzigd.", true); return; }
  try { await Library.putRaw({ ...r.raw, perfumeId: targetId }); }
  catch (e) { UI.toast("De meting is bewaard, maar de ruwe sensorreeks niet (opslag vol?). Exporteer de ruwe gegevens als je ze wilt bewaren.", true); }
  r.saved = targetId; const p = Library.get(targetId);
  UI.toast((r.measurement.source === "sensor" ? "Sensormeting" : "Gesimuleerde meting") + " bewaard bij " + p.brand + " " + p.name);
  UI.render(); const el = document.getElementById("rsSave"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "center" });
}

}

    <div class="actions"><button class="btn ghost" id="dupSep">Toch apart bewaren</button><button class="btn primary" id="dupOpen">Open bestaand</button></div>`,
    (s, close) => {
      $("#dupOpen", s).onclick = () => { close(); if (onOpen) onOpen(); else UI.go("perfume", { id: existing.id }); };
      $("#dupSep", s).onclick = async () => { close(); await onSeparate(); };
    });
}
async function guardedSave(p, after) {
  if (Library.has(p.id)) { after && after(Library.get(p.id)); return; }
  const doSave = async () => { const rec = await Library.save(p); UI.toast("Bewaard in je geurbibliotheek"); after && after(rec); };
  const dup = Library.findDuplicate(p.brand, p.name, p.id);
  if (dup) confirmDuplicate(dup, doSave); else await doSave();
}

/* ---------------------------- Scanner flow ------------------------- */
const Scanner = {
  set(patch) { Object.assign(UI.scan, patch); if (UI.cur.name === "scan") UI.render(); },
  step(text, s = "run") { const steps = UI.scan.steps || []; if (steps.length && steps[steps.length - 1].s === "run") steps[steps.length - 1].s = s === "fail" ? "fail" : "done"; if (text) steps.push({ t: text, s: "run" }); this.set({ steps }); },
  finishSteps(s = "done") { const st = UI.scan.steps || []; if (st.length && st[st.length - 1].s === "run") st[st.length - 1].s = s; },
  async handleFile(file) {
    if (!file) return;
    UI.scanView = "bottle";
    if (UI.cur.name !== "scan") UI.switchTab("scan");
    if (!file.type.startsWith("image/")) { this.set({ state: "error", errTitle: "Dit is geen afbeelding", errMsg: "Kies een foto (JPG, PNG of HEIC) van de barcode of de fles.", canAI: false, steps: [] }); return; }
    this.set({ state: "busy", steps: [], preview: null, perfume: null, code: null, confidence: null });
    try {
      this.step("Foto verwerken");
      const canvas = await Recognition.fileToCanvas(file);
      this.canvas = canvas;
      UI.scan.thumb = Recognition.scaled(canvas, 360).dataUrl();
      this.set({ preview: Recognition.scaled(canvas, 900).dataUrl() });
      this.step("Barcode zoeken");
      const bc = await Recognition.decodeBarcode(canvas);
      if (bc) {
        this.step(`Barcode ${bc.code} gelezen (${bc.engine}) — opzoeken`);
        UI.scan.code = bc.code;
        const hit = await ProductLookup.byBarcode(bc.code);
        if (hit) { this.finishSteps(); return this.set({ state: "found", perfume: hit.perfume, via: "barcode" }); }
        this.step(`Barcode niet in ${LocalCatalogProvider.label.toLowerCase()}`, "fail");
      } else this.step("Geen leesbare barcode gevonden", "fail");
      this.finishSteps("fail");
      await this.runAI();
    } catch (e) { this.finishSteps("fail"); this.set({ state: "error", errTitle: "Foto verwerken lukte niet", errMsg: (e && e.message) || "Probeer een andere foto.", canAI: false }); }
  },
  async byCode(raw) {
    const code = String(raw || "").replace(/\s/g, "");
    UI.scanView = "bottle";
    if (UI.cur.name !== "scan") UI.switchTab("scan");
    const err = $("#codeErr");
    if (!/^\d{6,14}$/.test(code)) { if (err) { err.hidden = false; err.textContent = "Een barcode bestaat uit 6 tot 14 cijfers."; } return; }
    UI.scan.code = code; this.canvas = null;
    this.set({ state: "busy", preview: null, steps: [{ t: "Barcode " + code + " opzoeken", s: "run" }], perfume: null, confidence: null });
    const hit = await ProductLookup.byBarcode(code);
    this.finishSteps(hit ? "done" : "fail");
    if (hit) this.set({ state: "found", perfume: hit.perfume, via: "barcode" });
    else this.set({ state: "error", errTitle: "Barcode niet gevonden", errMsg: `Barcode ${code} staat niet in de demodatabase. Maak een foto van de fles voor herkenning op beeld, of voer het parfum handmatig in.`, canAI: false });
  },
  async runOCR() {
    this.set({ state: "busy" }); this.step("Tekst op het etiket lezen (op je toestel)");
    try {
      const text = await Recognition.readLabel(this.canvas);
      const hit = Recognition.matchText(text);
      this.finishSteps(hit ? "done" : "fail");
      if (hit) return this.set({ state: "found", perfume: hit.perfume, via: "ocr", confidence: null });
      const seen = text.replace(/\s+/g, " ").trim().slice(0, 80);
      this.set({ state: "error", errTitle: "Parfum niet herkend", errMsg: (seen ? `Gelezen tekst: "${seen}". ` : "Er was geen tekst te lezen. ") + "Dit parfum staat niet in de demodatabase of het etiket was niet leesbaar. Probeer een foto recht van voren met het etiket scherp in beeld, of voer het parfum handmatig in.", canAI: false });
    } catch (e) {
      this.finishSteps("fail");
      const offline = e && e.code === "ocr_offline";
      this.set({ state: "error", errTitle: "Etiket lezen lukte niet", errMsg: offline ? "De tekstherkenning moet de eerste keer via internet worden geladen. Maak verbinding en probeer opnieuw, of voer het parfum handmatig in." : "De tekst op de foto kon niet worden gelezen. Probeer een andere foto of voer het parfum handmatig in.", canAI: offline });
    }
  },
  async runAI() {
    if (!this.canvas) { this.set({ state: "error", errTitle: "Geen foto", errMsg: "Maak eerst een foto van de fles.", canAI: false }); return; }
    if (STANDALONE) return this.runOCR();
    this.set({ state: "busy" }); this.step("Herkenning op beeld (Claude)");
    try {
      const r = await Recognition.identify(this.canvas);
      if (!r || !r.found || !r.brand || !r.name) { this.finishSteps("fail"); return this.set({ state: "error", errTitle: "Parfum niet herkend", errMsg: (r && r.reason ? r.reason + " " : "") + "Probeer een scherpere foto met het etiket goed zichtbaar, of voer het parfum handmatig in.", canAI: false }); }
      const match = (await ProductLookup.search(r.brand + " " + r.name))[0];
      this.finishSteps();
      if (match) return this.set({ state: "found", perfume: match, via: "ai", confidence: null });
      const fam = FAMILIES.some((f) => f.id === r.family) ? r.family : "";
      const p = { id: uid("ai"), source: "ai", brand: String(r.brand).slice(0, 80), name: String(r.name).slice(0, 80), concentration: r.concentration || "", family: fam, top: (r.top || []).slice(0, 10).map(String), heart: (r.heart || []).slice(0, 10).map(String), base: (r.base || []).slice(0, 10).map(String), description: String(r.description || "").slice(0, 500), barcode: UI.scan.code || "", image: UI.scan.thumb || null, bottle: { shape: "square", liquid: famOf(fam).color } };
      UI.transient.set(p.id, p);
      this.set({ state: "found", perfume: p, via: "ai", confidence: typeof r.confidence === "number" ? r.confidence : null });
    } catch (e) {
      this.finishSteps("fail");
      const code = e && e.code;
      const msg = code === "unavailable" || code === "not_granted" || code === "images_unavailable" ? "Herkenning op beeld is in deze weergave niet beschikbaar of je hebt geen toestemming gegeven. Voer het parfum handmatig in."
        : code === "rate_limited" ? "Er zijn net te veel herkenningen gedaan. Wacht even en probeer opnieuw, of voer het parfum handmatig in."
        : code === "image_rejected" ? "Deze foto kon niet worden verwerkt. Probeer een JPG- of PNG-foto."
        : "De herkenning gaf geen bruikbaar antwoord. Probeer opnieuw of voer het parfum handmatig in.";
      this.set({ state: "error", errTitle: "Herkenning lukte niet", errMsg: msg, canAI: code === "rate_limited" || code === "invalid_json" });
    }
  },
};
["#fileCam", "#fileLib"].forEach((s) => $(s).addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; Scanner.handleFile(f); }));

/* ---------------------------- Start -------------------------------- */
Library.on(() => { const n = UI.cur.name; if (["home", "library", "profile"].includes(n) && !document.activeElement?.matches("input,textarea,select")) UI.render(); });
UI.render();
/* Opstartscherm: minimaal ~1,4 s, verdwijnt vanzelf of bij een tik; blokkeert de app daarna nooit. */
(function splash() {
  const el = document.getElementById("splash"); if (!el) return;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0 = performance.now(), minMs = reduce ? 500 : 1400;
  let done = false;
  const hide = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => el.remove(), 700); };
  el.addEventListener("click", hide);
  const ready = () => setTimeout(hide, Math.max(0, minMs - (performance.now() - t0)));
  setTimeout(hide, 3500); /* vangnet */
  window.__splashReady = ready;
})();
Library.init().then(() => { SensorHub.applyConfig(); if (scentVisible()) UI.render(); }).catch(() => UI.toast("Je bibliotheek kon niet worden geladen.", true)).finally(() => window.__splashReady && window.__splashReady());
</script>

/* Serviceworker: app werkt offline na het eerste bezoek */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* zonder serviceworker werkt de app alleen online */ });
  });
}
</script>
